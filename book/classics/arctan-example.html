<aside class="cauchy-example arctan-example" aria-label="Interactive arctangent Taylor example"><div class="example-sticky">
<p class="classic-tag">One function throughout</p><h2>Watch the Taylor sums</h2>
<div class="example-tabs" role="group" aria-label="View of arctangent"><button data-arctan-mode="graph" aria-pressed="true">Function</button><button data-arctan-mode="sequence" aria-pressed="false">Partial sums</button><button data-arctan-mode="plane" aria-pressed="false">Off the real axis</button></div>
<label class="example-follow"><input id="arctan-follow" type="checkbox" checked> Follow the narrative</label>
<svg id="arctan-plot" viewBox="0 0 330 260" role="img" aria-labelledby="arctan-plot-title arctan-plot-description"><title id="arctan-plot-title">Arctangent and a Taylor polynomial</title><desc id="arctan-plot-description">Adjust the input and term count. The readout gives the function value, polynomial value, and error.</desc></svg>
<div class="arctan-legend"><span class="arctan-key function-key">Arctangent</span><span class="arctan-key sum-key">Taylor polynomial</span></div>
<div class="arctan-presets" role="group" aria-label="Input presets"><button data-arctan-x="0.5">Interior</button><button data-arctan-x="1">Endpoint</button><button data-arctan-x="1.05">Just outside</button><button data-arctan-x="1.5">Outside</button><button data-arctan-x="-1">Negative endpoint</button></div>
<div id="arctan-controls"><label>Input <output id="arctan-input-label">0.50</output><input type="range" id="arctan-input" min="-2" max="2" step="0.01" value="0.5"></label><label>Number of terms <output id="arctan-terms-label">12</output><input type="range" id="arctan-terms" min="1" max="120" step="1" value="12"></label></div>
<p id="arctan-status" role="status">Converges inside the interval</p><div id="arctan-readout" aria-live="polite"></div><p id="arctan-caption"></p>
<p class="example-note">The plot uses floating-point arithmetic. The linked Lean theorems prove the rational-input classification independently of these numerical displays.</p>
<noscript>The theorem and its proof explanation remain available without JavaScript.</noscript>
</div></aside>

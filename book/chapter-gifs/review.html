<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Chapter animations · Computable Analysis</title>
<style>
*{box-sizing:border-box}body{max-width:940px;margin:0 auto;padding:clamp(16px,4vw,38px);background:#faf9f5;color:#20332e;font:16px/1.5 system-ui,sans-serif}
h1{font:normal clamp(2rem,5vw,3rem)/1.1 Georgia,serif;margin:0}header{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:1.5rem}
a{color:#006c70;text-underline-offset:3px}label{display:block;margin-bottom:.35rem;font-weight:600}
select,button{font:inherit;color:inherit;background:#fffefa;border:1px solid #a6b4ab;border-radius:4px;padding:.52rem .7rem}
select{width:100%}button{cursor:pointer}a:focus-visible,select:focus-visible,button:focus-visible{outline:3px solid #ab471d;outline-offset:2px}
figure{margin:1.1rem 0}.screen{min-height:9rem;display:grid;place-items:center;border:1px solid #cad4cb;background:white}.screen img{display:block;max-width:100%;max-height:70vh;height:auto;object-fit:contain}
figcaption{display:flex;align-items:baseline;justify-content:space-between;gap:8px;flex-wrap:wrap;margin-top:.6rem;color:#516159}footer{display:flex;gap:.6rem;flex-wrap:wrap;margin-top:1.1rem}[hidden]{display:none!important}
</style></head><body>
<header><h1>Chapter animations</h1><a id="archive" href="chapter-gifs.zip" download>Download all GIFs</a></header>
<main>
<label for="figures">Choose a figure</label><select id="figures"><!-- options --></select>
<figure><div class="screen"><img id="figure" alt=""><button hidden id="play" type="button">Play this animation</button></div>
<figcaption><span id="location"></span><a id="individual" href="gifs/sqrt-secant-zoom.gif">Open GIF</a></figcaption></figure>
<footer><button id="previous" type="button">Previous figure</button><button id="next" type="button">Next figure</button></footer>
<noscript><ul><!-- links --></ul></noscript>
</main>
<script>
const list = document.querySelector('#figures');
const img = document.querySelector('#figure');
const play = document.querySelector('#play');
const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)');
function show() {
  const hash = location.hash.slice(1);
  list.value = Array.from(list.options).some(o => o.value === hash) ? hash : list.options[0].value;
  const option = list.selectedOptions[0];
  document.querySelector('#location').textContent = option.parentElement.label + ' · ' + (list.selectedIndex + 1) + ' of ' + list.length;
  const file = 'gifs/' + option.value + '.gif';
  document.querySelector('#individual').href = file;
  img.alt = option.text;
  img.hidden = reducedMotion.matches;
  play.hidden = !img.hidden;
  if (img.hidden) img.removeAttribute('src');
  else img.src = file;
  document.querySelector('#previous').disabled = list.selectedIndex === 0;
  document.querySelector('#next').disabled = list.selectedIndex === list.length - 1;
}
list.onchange = () => { location.hash = list.value; };
play.onclick = () => { img.src = document.querySelector('#individual').href; img.hidden = false; play.hidden = true; };
for (const [id, step] of [['previous', -1], ['next', 1]]) {
  document.getElementById(id).onclick = () => { location.hash = list.options[list.selectedIndex + step].value; };
}
window.addEventListener('hashchange', show);
reducedMotion.addEventListener('change', show);
show();
</script></body></html>

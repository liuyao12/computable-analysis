name: Cartwright formalization
on:
  push:
    branches: [work/cartwright-completion]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cartwright-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: false
          test: false
          lint: false
      - name: Export toolchain source interfaces for reproducible local verification
        run: |
          prefix=$(lean --print-prefix)
          tar -czf /tmp/cartwright-toolchain-interfaces.tar.gz -C "$prefix" include src/lean/Lean/Compiler src/lean/Lean/Environment.lean src/lean/Lean/Setup.lean
      - uses: actions/upload-artifact@v4
        with:
          name: cartwright-toolchain-interfaces
          path: /tmp/cartwright-toolchain-interfaces.tar.gz
          retention-days: 7
      - uses: actions/cache/restore@v5
        with:
          path: .lake
          key: cartwright-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-${{ github.sha }}
          restore-keys: |
            three-proof-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-
      - name: Verify available Cartwright declarations
        run: |
          lake build ComputableAnalysis.CartwrightArithmetic
          if test -f ComputableAnalysis/CartwrightMoments.lean; then lake build ComputableAnalysis.CartwrightMoments; fi

name: Fixed-schedule derivative proof check
on:
  push:
    branches: [work/fixed-schedule-sine]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: sine-derivative-${{ github.ref }}
  cancel-in-progress: true
jobs:
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
      - uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: true
          build-args: "ComputableAnalysis.SineDerivative"
          test: false
          lint: false
      - name: Check theorem statements and transitive axioms
        run: python3 blueprint/checks/check_sine_derivative.py --no-build
      - name: Audit the rational foundation
        run: python3 blueprint/checks/check_foundation_imports.py
      - name: Ensure the check did not rewrite tracked source
        run: git diff --exit-code

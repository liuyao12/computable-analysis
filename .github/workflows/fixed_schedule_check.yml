name: Fixed-schedule derivative proof check
on:
  push:
    branches: [work/fixed-schedule-sine]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: fixed-schedule-${{ github.ref }}
  cancel-in-progress: true
jobs:
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
      - uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: false
          test: false
          lint: false
      - name: Compile fixed-schedule derivative
        run: |
          set +e
          lake build ComputableAnalysis.FixedScheduleSine > /tmp/fixed-proof.log 2>&1
          result=$?
          python - <<'PY'
          from pathlib import Path
          lines=Path('/tmp/fixed-proof.log').read_text().splitlines()
          printing=False
          for line in lines:
            if 'FixedScheduleSine' in line or 'error:' in line or 'Build completed' in line:
              printing=True
            if printing:
              print(line)
          PY
          exit "$result"
      - name: Inspect theorem dependencies
        run: |
          cat > /tmp/fixed-audit.lean <<'EOF'
          import ComputableAnalysis.FixedScheduleSine
          open ComputableAnalysis FixedSchedule
          #print axioms sineDerivative_valid
          #print axioms sineDerivative_output_overlap
          #check sineDerivative_width_le
          #eval ((sineDerivative (1/2)).compute 4).width
          EOF
          lake env lean /tmp/fixed-audit.lean
      - name: Audit the rational foundation
        run: python blueprint/checks/check_foundation_imports.py

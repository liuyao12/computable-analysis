name: Lean Action CI
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  build:
    if: github.ref_name != 'work/fixed-schedule-sine'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
      - uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: true
          build-args: "ComputableAnalysis ComputableAnalysis.PiProofs"
          test: false
          lint: false

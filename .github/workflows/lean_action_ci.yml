name: Lean Action CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    # PiProofs is intentionally compiled below as part of the canonical
    # trigonometric bridge.  A cold build currently takes roughly an hour
    # because Lean must process its large syntax tree, so the cap must cover
    # that real verification rather than cancelling a healthy build.
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v5
      # The canonical root exports the supported calculus and algebraic
      # foundations plus the scoped Wiedijk registry.  PiProofs is an
      # intentionally opt-in presentation module, but it supplies the
      # project’s central arctangent/π bridge and must stay checked too.
      - uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: true
          build-args: "ComputableAnalysis ComputableAnalysis.PiProofs ComputableAnalysis.Basel.RealZeta ComputableAnalysis.ArctanTaylorConvergence"
          test: false
          lint: false
      - name: Audit the Basel and Euler proof dependencies
        run: lake env lean scripts/check_basel.lean
      - name: Audit arctangent Taylor convergence and divergence
        run: lake env lean scripts/check_arctan_taylor.lean
      - name: Audit whole-chunk integral constructions
        run: |
          python3 scripts/audit_integral_enclosures.py
          lake env lean scripts/check_integral_enclosures.lean
      - name: Audit holomorphic witnesses and derivative continuity
        run: lake env lean scripts/check_holomorphic.lean

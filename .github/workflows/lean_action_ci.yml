name: Lean Action CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v5
      # The canonical root exports the supported calculus and algebraic
      # foundations plus the scoped Wiedijk registry. Worked examples remain
      # opt-in modules and are not part of this public compatibility target.
      - uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: true
          build-args: "ComputableAnalysis"
          test: false
          lint: false

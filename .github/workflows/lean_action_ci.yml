name: Lean Action CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    # PiProofs is intentionally compiled below as part of the canonical
    # trigonometric bridge.  A cold build currently takes roughly an hour
    # because Lean must process its large syntax tree, so the cap must cover
    # that real verification rather than cancelling a healthy build.
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v5
      # The canonical root exports the supported calculus and algebraic
      # foundations plus the scoped Wiedijk registry.  PiProofs is an
      # intentionally opt-in presentation module, but it supplies the
      # project’s central arctangent/π bridge and must stay checked too.
      - uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: true
          build-args: "ComputableAnalysis ComputableAnalysis.PiProofs"
          test: false
          lint: false

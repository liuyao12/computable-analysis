name: Optional Mathlib comparison
on:
  push:
    branches: [work/cosine-basepoint]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: mathlib-comparison-${{ github.ref }}
  cancel-in-progress: true
jobs:
  bridge:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: false
          test: false
          lint: false
      - uses: actions/cache@v5
        with:
          path: /tmp/comparison-mathlib
          key: cosine-mathlib-51e6992efd06126df61a496bebf8f49482a4e129
      - name: Prepare pinned comparison library, outside the project foundation
        run: |
          if ! test -d /tmp/comparison-mathlib/.git; then
            git clone --depth 1 --branch v4.33.0-rc2 https://github.com/leanprover-community/mathlib4.git /tmp/comparison-mathlib
          fi
          cd /tmp/comparison-mathlib
          test "$(git rev-parse HEAD)" = 51e6992efd06126df61a496bebf8f49482a4e129
          lake exe cache get Mathlib/Analysis/SpecialFunctions/Integrals/Basic.lean Mathlib/Tactic.lean
          printf 'import Mathlib.Analysis.SpecialFunctions.Integrals.Basic\nimport Mathlib.Tactic\n#check integral_cos\n' > /tmp/MathlibCheck.lean
          lake env lean /tmp/MathlibCheck.lean
      - name: Export interpreter and shared-library artifacts
        run: |
          python3 - <<'PY'
          import pathlib, tarfile, collections
          root = pathlib.Path('/tmp/comparison-mathlib')
          paths = []
          for path in root.rglob('*'):
              if not path.is_file() or '.git' in path.parts: continue
              if path.suffix in ['.ir','.so'] or path.name.endswith('.bc'):
                  paths.append(path)
          print(collections.Counter(p.suffix for p in paths))
          for path in paths[:30]: print(path.relative_to(root))
          with tarfile.open('/tmp/mathlib-interpreter.tar.gz','w:gz',compresslevel=3) as out:
              for path in paths: out.add(path, arcname=str(path.relative_to(root)), recursive=False)
          print('Packed', len(paths), 'files; bytes', pathlib.Path('/tmp/mathlib-interpreter.tar.gz').stat().st_size)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: mathlib-interpreter
          path: /tmp/mathlib-interpreter.tar.gz
          retention-days: 2
          compression-level: 0

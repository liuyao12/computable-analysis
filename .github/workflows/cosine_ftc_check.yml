name: Cosine FTC proof check
on:
  push:
    branches: [work/cosine-ftc]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cosine-ftc-${{ github.ref }}
  cancel-in-progress: true
jobs:
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: false
          test: false
          lint: false
      - uses: actions/cache/restore@v5
        with:
          path: .lake
          key: cosine-ftc-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-${{ github.sha }}
          restore-keys: |
            cosine-ftc-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-
            geometric-sine-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-
      - name: Check cosine FTC module
        run: |
          if test -f ComputableAnalysis/CosineFTC.lean; then
            lake build ComputableAnalysis.CosineFTC
          else
            lake build ComputableAnalysis.NormalizedSineDerivative
          fi
      - name: Export local proof environment
        run: |
          prefix=$(lean --print-prefix)
          mkdir -p /tmp/lean-proof-runtime
          cp -a "$prefix/bin" /tmp/lean-proof-runtime/
          mkdir -p /tmp/lean-proof-runtime/lib
          cp -a "$prefix/lib/lean" /tmp/lean-proof-runtime/lib/
          find "$prefix/lib" -maxdepth 1 -name '*.so*' -exec cp -a {} /tmp/lean-proof-runtime/lib/ \;
          find /tmp/lean-proof-runtime -type f \( -name '*.a' -o -name '*.ilean' -o -name '*.c' \) -delete
          cp -a .lake/build/lib/lean /tmp/lean-proof-runtime/project
          tar -czf /tmp/lean-proof-runtime.tar.gz -C /tmp lean-proof-runtime
          split -b 400M /tmp/lean-proof-runtime.tar.gz /tmp/runtime.part.
      - uses: actions/upload-artifact@v4
        with:
          name: cosine-ftc-runtime-part-aa
          path: /tmp/runtime.part.aa
          retention-days: 1
          compression-level: 0
      - uses: actions/upload-artifact@v4
        with:
          name: cosine-ftc-runtime-part-ab
          path: /tmp/runtime.part.ab
          retention-days: 1
          compression-level: 0
      - uses: actions/cache/save@v5
        if: always()
        with:
          path: .lake
          key: cosine-ftc-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-${{ github.sha }}

name: Publish modular dependency graph
on:
  workflow_dispatch:
    inputs:
      base_run:
        description: Successful publication run containing the existing live Pages artifact
        required: true
        default: '37611924596'
permissions:
  contents: read
  actions: read
  pages: write
  id-token: write
concurrency:
  group: pages-verified-proof-publication
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: github-pages
          path: previous
          run-id: ${{ inputs.base_run }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Overlay the checked graph while preserving previous pages
        env:
          BASE_RUN: ${{ inputs.base_run }}
        run: |
          mkdir site
          tar -xf previous/artifact.tar -C site
          python3 - <<'PY'
          from pathlib import Path
          import json,hashlib,shutil,os,re
          site=Path('site');source=Path('book/modular-dependencies')
          data=json.loads((source/'modular-dependencies.json').read_text())
          assert len(data['nodes'])==13
          for item in data['sources'].values():
              assert hashlib.sha256(item['text'].encode()).hexdigest()==item['sha256']
          proof=data['exponentialFoundation']
          assert proof['api']=='ComputableAnalysis.ExponentialComputations.API'
          assert proof['mathlibDependency'] is False
          assert len(proof['checkedEndpoints'])==8
          audit=(source/'exponential-foundation-audit.txt').read_text()
          assert hashlib.sha256(audit.encode()).hexdigest()==proof['axiomAuditSha256']
          assert 'sorryAx' not in audit and 'error:' not in audit
          for name in proof['checkedEndpoints']:
              match=re.search("'"+re.escape(name)+r"' depends on axioms: \[([^]]*)\]",audit)
              assert match,name
              assert set(re.findall(r'[\w.]+',match[1])) <= {'propext','Classical.choice','Quot.sound'},name
          cm=data['cmGeneralization']
          assert cm['classPolynomialTheoremProved'] is False
          assert len(cm['checkedEndpoints'])==16
          cm_audit=(source/'cm-values-audit.txt').read_text()
          assert hashlib.sha256(cm_audit.encode()).hexdigest()==cm['axiomAuditSha256']
          assert 'sorryAx' not in cm_audit and 'error:' not in cm_audit
          for name in cm['checkedEndpoints']:
              match=re.search("'"+re.escape(name)+r"' depends on axioms: \[([^]]*)\]",cm_audit)
              assert match,name
              assert set(re.findall(r'[\w.]+',match[1])) <= {'propext','Classical.choice','Quot.sound'},name
          cm_build=(source/'cm-values-build.txt').read_text()
          assert 'Build completed successfully' in cm_build and 'error:' not in cm_build
          before={str(p.relative_to(site)):hashlib.sha256(p.read_bytes()).hexdigest() for p in site.rglob('*') if p.is_file()}
          files={'index.html':'modular-proofs.html',
              'modular-dependencies.json':'modular-dependencies.json',
              'constants-audit.txt':'modular-constants-audit.txt',
              'exponential-foundation-audit.txt':'modular-exponential-foundation-audit.txt',
              'exponential-foundation-build.txt':'modular-exponential-foundation-build.txt',
              'import-audit.txt':'modular-import-audit.txt',
              'check_cm163_exponential_foundation.lean':'check_cm163_exponential_foundation.lean',
              'cm-values-audit.txt':'modular-cm-values-audit.txt',
              'cm-values-build.txt':'modular-cm-values-build.txt',
              'check_cm_elliptic_values.lean':'check_cm_elliptic_values.lean'}
          for src,dst in files.items():
              shutil.copy(source/src,site/dst)
          index=site/'index.html';text=index.read_text()
          link='<p id="modular-proof-map-link"><a href="modular-proofs.html">Modular arithmetic: expandable dependency map</a></p>'
          if 'id="modular-proof-map-link"' not in text:
              text=text.replace('</body>',link+'</body>')
          index.write_text(text)
          changed=set(files.values())|{'index.html','modular-publication.json'}
          for name,digest in before.items():
              if name not in changed:
                  assert hashlib.sha256((site/name).read_bytes()).hexdigest()==digest,name
          (site/'modular-publication.json').write_text(json.dumps({'baseRun': int(os.environ['BASE_RUN']),'preservedFiles':sum(n not in changed for n in before),'graphBundles':len(data['nodes']),'sourceModules':len(data['imports']),'sourceSnapshots':len(data['sources']),'currentExponentialApi':True,'auditedCMValueEndpoints':len(cm['checkedEndpoints']),'classPolynomialTheoremProved':False,'cmValuesAuditSha256':cm['axiomAuditSha256'],'auditedExponentialEndpoints':len(proof['checkedEndpoints']),'exponentialAuditSha256':proof['axiomAuditSha256'],'graphSha256':hashlib.sha256((site/'modular-proofs.html').read_bytes()).hexdigest()}))
          PY
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4

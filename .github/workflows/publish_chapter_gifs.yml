name: Publish chapter GIFs
on: workflow_dispatch
permissions:
  contents: read
  actions: read
  deployments: read
  pages: write
  id-token: write
concurrency:
  group: pages-verified-proof-publication
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-slim
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - name: Locate the currently published Pages artifact
        id: live
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json, os, re, urllib.request
          api = os.environ["GITHUB_API_URL"] + "/repos/" + os.environ["GITHUB_REPOSITORY"]
          def read(url):
              request = urllib.request.Request(url, headers={"Authorization": "Bearer " + os.environ["GH_TOKEN"]})
              with urllib.request.urlopen(request, timeout=30) as response:
                  return json.load(response)
          for deployment in read(api + "/deployments?environment=github-pages&per_page=30"):
              statuses = read(deployment["statuses_url"] + "?per_page=1")
              if statuses and statuses[0]["state"] == "success":
                  run = re.search(r"/actions/runs/(\d+)(?:/|$)", statuses[0]["log_url"])
                  with open(os.environ["GITHUB_OUTPUT"], "a") as output:
                      print("run=" + run[1], file=output)
                  break
          else:
              raise SystemExit("Could not identify the live Pages deployment")
          PY
      - uses: actions/download-artifact@v4
        with:
          name: github-pages
          path: previous
          run-id: ${{ steps.live.outputs.run }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Restore the live edition
        run: |
          mkdir site
          tar -xf previous/artifact.tar -C site
      - name: Extract the animations and update the two square-root figures
        run: |
          python3 scripts/render_foundation_preface_tex.py --check
          python3 scripts/apply_chapter_gifs.py site
          python3 -m zipfile -t site/chapter-gifs/chapter-gifs.zip
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
          retention-days: 90
      - id: deploy
        uses: actions/deploy-pages@v4

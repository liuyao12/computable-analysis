name: Publish verified proof blueprint

# Pinned mathematics plus checked finite geometry and the Leibniz benchmark.
# No theorem branch is merged; existing Pages protections are unchanged.
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish_verified_blueprint.yml'
      - '.github/reader-edition/**'
      - 'book/fundamental-matrix/**'
      - 'book/algebraic-ode/**'
      - 'book/zeta-real/**'
      - 'ComputableAnalysis/ZetaReal*'
      - 'ComputableAnalysis/ZetaReal/**'
      - 'scripts/check_zeta_real.lean'
      - 'scripts/check_basel.lean'
      - 'ComputableAnalysis/Basel/**'
      - 'docs/BASEL.md'
      - 'docs/ZETA_REAL.md'
      - 'blueprint/src/16-transforms-zeta.tex'
      - 'ComputableAnalysis/AlgebraicODE*'
      - 'ComputableAnalysis/AlgebraicODE/**'
      - 'ComputableAnalysis/Apery*'
      - 'ComputableAnalysis/Apery/**'
      - 'docs/APERY.md'
      - 'ComputableAnalysis/DifferentialReciprocal.lean'
      - 'ComputableAnalysis/FormalPowerSeriesAlgebra.lean'
      - 'ComputableAnalysis/FormalPowerSeriesPolynomial.lean'
      - 'ComputableAnalysis/GeometricPowerSeries.lean'
      - 'ComputableAnalysis/GeometricSeriesCalculus.lean'
      - 'ComputableAnalysis/CauchyProductEstimate.lean'
      - 'ComputableAnalysis/LinearGrowth.lean'
      - 'scripts/check_algebraic_ode.lean'
      - 'docs/FUCHS_PAINLEVE.md'
      - 'ComputableAnalysis/PiProofs.lean'
      - 'ComputableAnalysis/LeibnizPi*.lean'
      - 'ComputableAnalysis/PDE/CauchyContour.lean'
      - 'ComputableAnalysis/HolomorphicJet.lean'
      - 'scripts/check_cauchy_arctan.lean'
      - 'scripts/check_cauchy_taylor.lean'
      - 'ComputableAnalysis/CauchyTaylor*.lean'
      - 'ComputableAnalysis/CertifiedComplexApproximation.lean'
      - 'docs/CAUCHY_TAYLOR.md'
      - 'docs/PNT_CAUCHY_ARCTAN.md'
      - 'blueprint/src/13-complex-paths.tex'
      - 'ComputableAnalysis/AlternatingRemainder.lean'
      - 'ComputableAnalysis/ArctanTaylorRemainder.lean'
      - 'ComputableAnalysis/FiniteSecantIntegralOrder.lean'
      - 'scripts/check_leibniz.lean'
      - 'scripts/check_leibniz_transmutation.lean'
      - 'ComputableAnalysis/FiniteTransmutation.lean'
      - 'ComputableAnalysis/LeibnizTransmutation.lean'
      - 'docs/LEIBNIZ_TRANSMUTATION.md'
      - 'ComputableAnalysis/RationalGeometry.lean'
      - 'ComputableAnalysis/QuarterCircleGeometry.lean'
      - 'ComputableAnalysis/GeometryFoundation.lean'
      - 'book/checks/ExportRationalGeometry.lean'
      - 'blueprint/src/02-rational-geometry.tex'
      - 'blueprint/src/02-circle-sphere.tex'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
  pages: write
  id-token: write
concurrency:
  group: pages-verified-proof-publication
  cancel-in-progress: false
env:
  SOURCE_RUN: '35121587005'
  SOURCE_SHA: 'f630241adeae35fc06a5fd4921a4df6396e291d0'
  TRIGGER_SHA: '6b0d89386074fd99ec422555169a539e8787ae80'
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Require the pinned mathematical verification
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json,os,urllib.request
          base='https://api.github.com/repos/'+os.environ['GITHUB_REPOSITORY']
          def get(path):
              req=urllib.request.Request(base+path,headers={
                  'Authorization':'Bearer '+os.environ['GH_TOKEN'],
                  'Accept':'application/vnd.github+json'})
              with urllib.request.urlopen(req,timeout=30) as r:return json.load(r)
          rid=os.environ['SOURCE_RUN'];run=get('/actions/runs/'+rid)
          assert run['head_sha']==os.environ['TRIGGER_SHA']
          assert run['name']=='Integral portfolio verification'
          assert run['status']=='completed' and run['conclusion']=='success'
          job=next(j for j in get('/actions/runs/'+rid+'/jobs')['jobs'] if j['name']=='verify')
          assert job['conclusion']=='success'
          steps={s['name']:s['conclusion'] for s in job['steps']}
          for name in ['Materialize and commit the exact reviewed source patch',
                       'Verify all proofs, exact comparisons, mathematical maps and browser regressions',
                       'Retain the exact source and verified publication manifest']:
              assert steps[name]=='success',name
          print('Verified unchanged mathematical snapshot:',os.environ['SOURCE_SHA'])
          PY
      - name: Restore the hash-checked pinned reader archive
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/reader-edition/reader_base.py
      - uses: actions/upload-artifact@v4
        with:
          name: verified-reader-base
          path: downloaded/artifact.tar
          retention-days: 90
      - name: Validate and unpack the exact proof artifact
        run: |
          python3 - <<'PY'
          import hashlib,json,os,pathlib,tarfile
          with tarfile.open('downloaded/artifact.tar') as t:t.extractall('site',filter='data')
          root=pathlib.Path('site');read=lambda f:json.loads((root/f).read_text())
          sha=os.environ['SOURCE_SHA'];p=read('reading/portfolio-publication.json')
          assert p['sourceCommit']==sha and p['triggerCommit']==os.environ['TRIGGER_SHA']
          assert str(p['sourceRun'])==os.environ['SOURCE_RUN'] and p['allVerificationStepsPassed']
          m=read('reading/manifest.json');maps=read('reading/maps.json')
          audit=read('reading/integral-portfolio-audit.json')
          comparison=read('reading/integral-portfolio-comparison.json')
          assert m['sourceCommit']==m['proofSourceCommit']==maps['sourceCommit']==audit['sourceCommit']==comparison['sourceCommit']==sha
          assert m['preservedFirstTwo'] and m['cartwrightComplete'] and m['integralPortfolio']
          assert m['checkedPairedMaps']==7 and m['checkedSingleProofMaps']==1
          assert all(audit['checks'].values()) and len(audit['closedProofs'])==16
          assert all(read('reading/cartwright-audit.json')['checks'].values())
          assert all('sorryAx' not in r['axioms'] for r in audit['closedProofs'])
          for f,h in audit['unchangedArtifacts'].items():assert hashlib.sha256((root/f).read_bytes()).hexdigest()==h,f
          assert all(r['identicalMathematicalText'] for r in read('reading/preservation.json')['rendered'].values())
          print('PASS: proof results, source revision, chapter preservation and previous comparisons')
          PY
      - name: Materialize the exact geometry proof inputs
        run: |
          set -euo pipefail
          git fetch --depth=1 origin "$SOURCE_SHA"
          mkdir -p geometry-base geometry-reports
          git archive "$SOURCE_SHA" | tar -x -C geometry-base
          cmp lean-toolchain geometry-base/lean-toolchain
          for name in RationalGeometry QuarterCircleGeometry GeometryFoundation; do
            cp "ComputableAnalysis/$name.lean" "geometry-base/ComputableAnalysis/$name.lean"
          done
          cp book/checks/ExportRationalGeometry.lean geometry-base/book/checks/ExportRationalGeometry.lean
          git diff --check
      - uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: false
          test: false
          lint: false
      - uses: actions/cache@v5
        with:
          path: geometry-base/.lake
          key: rational-geometry-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-${{ github.sha }}
          restore-keys: |
            rational-geometry-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-
      - name: Check finite geometry and its exact quarter-circle bridge
        run: |
          set -euo pipefail
          (cd geometry-base && lake build ComputableAnalysis.GeometryFoundation) | tee geometry-reports/build.log
          (cd geometry-base && lake env lean book/checks/ExportRationalGeometry.lean) | tee geometry-reports/audit.log
          cp geometry-base/geometry-reports/rational-geometry.json geometry-reports/
      - name: Install reader-only rendering prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-dejavu-core graphviz
          python -m pip install beautifulsoup4 Pillow playwright
          if ! command -v google-chrome && ! command -v chromium; then
            python -m playwright install --with-deps chromium
          fi
      - name: Build the reader title and scaled worked illustration
        run: python3 .github/reader-edition/analysis_edition.py --site site --revision "$GITHUB_SHA"
      - name: Check exact bounds, rendering, navigation, mobile and preserved proof data
        run: python3 .github/reader-edition/test_edition.py --site site --report reader-edition-tests
      - name: Expand the Chapter 1 flashcards with Newton and Log(i)
        run: python3 .github/reader-edition/place_catalogue.py --site site --revision "$GITHUB_SHA"
      - name: Test exact series terms, logarithm enclosures and rendered flashcards
        run: python3 .github/reader-edition/test_placement.py --site site --report reader-edition-tests
      - name: Expose Newton patterns and add Machin and alternative logarithm computations
        run: python3 .github/reader-edition/pi_patterns.py --site site --revision "$GITHUB_SHA"
      - name: Verify coefficient recurrences, independent logarithm bounds and final rendering
        run: python3 .github/reader-edition/test_pi_patterns.py --site site --report reader-edition-tests
      - name: Group the arctangent computations under one flashcard
        run: python3 .github/reader-edition/group_arctan.py --site site --revision "$GITHUB_SHA"
      - name: Verify grouped formulas, fragment navigation and desktop and mobile rendering
        run: python3 .github/reader-edition/test_arctan_group.py --site site --report reader-edition-tests
      - name: Build the computation-first geometry chapter and checked maps
        run: python3 .github/reader-edition/rational_geometry.py --site site --revision "$GITHUB_SHA" --audit geometry-reports/rational-geometry.json
      - name: Verify geometry statements, stage values, maps and rendering
        run: python3 .github/reader-edition/test_rational_geometry.py --site site --report reader-edition-tests
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install the Fundamental Matrix build-only dependency
        run: npm install --prefix book/fundamental-matrix --ignore-scripts --no-audit --no-fund
      - name: Add the Fundamental Matrix reader page and book links
        run: python3 .github/reader-edition/fundamental_matrix.py --site site --revision "$GITHUB_SHA"
      - name: Check exact matrix iteration, preservation, links and notebook rendering
        run: python3 .github/reader-edition/test_fundamental_matrix.py --site site --report reader-edition-tests
      - uses: actions/cache@v5
        with:
          path: .lake
          key: leibniz-${{ hashFiles('lean-toolchain', 'lake-manifest.json', 'ComputableAnalysis/**/*.lean') }}
          restore-keys: |
            leibniz-
      - name: Check the Leibniz proofs, transmutation and dependency separation
        run: |
          set -euo pipefail
          mkdir -p leibniz-reports
          lake build ComputableAnalysis ComputableAnalysisBlueprint checkdecls | tee leibniz-reports/build.log
          lake env lean scripts/check_leibniz.lean | tee leibniz-reports/proofs.log
          lake env lean scripts/check_leibniz_transmutation.lean | tee leibniz-reports/transmutation.log
          lake env .lake/packages/checkdecls/.lake/build/bin/checkdecls blueprint/lean_decls | tee leibniz-reports/declarations.log
          python3 blueprint/checks/check_foundation_imports.py | tee leibniz-reports/imports.log
          python3 blueprint/checks/check_special_function_identities.py | tee leibniz-reports/identities.log
      - name: Publish the checked geometric transmutation reconstruction
        run: python3 .github/reader-edition/leibniz_transmutation.py --site site --revision "$GITHUB_SHA" --audit leibniz-reports/transmutation.log --closure tmp/leibniz-transmutation-closure.txt
      - name: Add only the checked Leibniz dependency note
        run: python3 .github/reader-edition/leibniz_benchmark.py --site site --revision "$GITHUB_SHA" --audit leibniz-reports/proofs.log --closure tmp/leibniz-dependency-closure.txt
      - name: Check and publish the Fuchs-Painleve subproject
        run: |
          set -euo pipefail
          mkdir -p algebraic-ode-reports
          lake build ComputableAnalysis.AlgebraicODE.Tests ComputableAnalysis.Apery.Tests | tee algebraic-ode-reports/build.log
          lake env lean scripts/check_algebraic_ode.lean | tee algebraic-ode-reports/axioms.log
          python3 .github/reader-edition/algebraic_ode.py --site site --revision "$GITHUB_SHA" --audit algebraic-ode-reports/axioms.log
      - name: Add the bundled mathematical comparison of four Leibniz proof routes
        run: python3 .github/reader-edition/leibniz_graph.py --site site --revision "$GITHUB_SHA"
      - name: Verify proof routes, source links, preservation and responsive graph interaction
        run: python3 .github/reader-edition/test_leibniz_graph.py --site site --report reader-edition-tests
      - name: Check and publish the arctangent Cauchy normalization and PNT+ comparison
        run: |
          set -euo pipefail
          mkdir -p cauchy-reports
          lake build ComputableAnalysis.PDE.CauchyContour ComputableAnalysis.CauchyTaylorExamples | tee cauchy-reports/build.log
          lake env lean scripts/check_cauchy_arctan.lean | tee cauchy-reports/audit.log
          lake env lean scripts/check_cauchy_taylor.lean | tee cauchy-reports/taylor-audit.log
          cp cauchy-reports/taylor-audit.log site/reading/cauchy-taylor-audit.log
          cp tmp/cauchy-taylor-closure.txt site/reading/cauchy-taylor-closure.txt
          python3 .github/reader-edition/pnt_cauchy.py --site site --revision "$GITHUB_SHA" --audit cauchy-reports/audit.log --closure tmp/cauchy-arctan-closure.txt
          python3 .github/reader-edition/test_pnt_cauchy.py --site site --report reader-edition-tests
      - name: Verify and publish the real-domain zeta construction
        run: |
          mkdir -p zeta-reports
          lake build ComputableAnalysis.ZetaReal.Tests ComputableAnalysis.Basel.RealZeta | tee zeta-reports/build.log
          lake env lean scripts/check_basel.lean | tee zeta-reports/basel-dependencies.log
          lake env lean scripts/check_zeta_real.lean | tee zeta-reports/axioms.log
          python3 .github/reader-edition/zeta_real.py --site site --revision "$GITHUB_SHA" --audit zeta-reports/axioms.log
          python3 .github/reader-edition/test_zeta_real.py --site site --report reader-edition-tests
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reader-edition-validation
          path: |
            reader-edition-tests
            geometry-reports
            leibniz-reports
            algebraic-ode-reports
            zeta-reports
            site/reading/zeta-real-edition.json
            cauchy-reports
            site/reading/cauchy-arctan-publication.json
            site/reading/algebraic-ode-edition.json
            site/reading/leibniz-benchmark.json
            site/reading/leibniz-graph-publication.json
            site/reading/leibniz-transmutation.json
            site/reading/leibniz-transmutation-closure.txt
            site/reading/leibniz-dependency-closure.txt
            site/reading/analysis-edition.json
            site/reading/cosine-half-interval.json
            site/reading/catalogue-placement.json
            site/reading/pi-flashcards-calculation.json
            site/reading/pi-patterns.json
            site/reading/arctan-group.json
            site/reading/rational-geometry-edition.json
            site/reading/fundamental-matrix-edition.json
          retention-days: 14
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
          retention-days: 7
  deploy:
    needs: prepare
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify the live geometry chapter and preserved comparisons
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          python3 - <<'PY'
          import hashlib,json,os,time,urllib.request
          from fractions import Fraction as Q
          revision=os.environ['GITHUB_SHA'];base=os.environ['PAGE_URL'].rstrip('/')
          def get(path,binary=False):
              with urllib.request.urlopen(base+path+'?edition='+revision,timeout=25) as r:
                  return r.read() if binary else json.load(r)
          last=None
          for attempt in range(18):
              try:
                  report=get('/reading/analysis-edition.json');placement=get('/reading/catalogue-placement.json')
                  numbers=get('/reading/pi-flashcards-calculation.json');patterns=get('/reading/pi-patterns.json')
                  group=get('/reading/arctan-group.json')
                  assert report['documentationRevision']==placement['documentationRevision']==numbers['documentationRevision']==patterns['documentationRevision']==group['documentationRevision']==revision
                  assert report['proofSourceCommit']==os.environ['SOURCE_SHA']
                  assert report['title']=='Computable Analysis' and report['subtitle']=='An alternative foundation to Calculus'
                  assert not report['homeTeaser'] and report['chapterOneCatalogue']
                  assert report['formulaCount']==placement['formulaCount']==group['flashcardCount']==7
                  assert report['underlyingRepresentationCount']==group['underlyingRepresentationCount']==11
                  assert report['arctangentGrouped'] and report['catalogueImmediatelyAfterHeading']
                  assert group['mainFormula']==r'\pi=4\arctan(1)'
                  assert group['methods']==['pi-geometry','pi-arctan-integral','pi-leibniz','pi-brouncker','pi-machin']
                  assert group['originalFormulasRetained'] and group['machinUsesArctanOnly']
                  assert group['oldMethodFragmentsPreserved'] and group['proofDataAndNumericsUnchanged']
                  assert report['newtonFactored'] and report['machinCard']
                  assert patterns['logarithmMethods']==['local-taylor','symmetric-log','machin']
                  assert not patterns['usesNumericalPi'] and not patterns['usesNumericalLog']
                  assert not patterns['leanStageExecution'] and not patterns['newLeanProofsClaimed']
                  assert not report['cosineQuadratureInCatalogue'] and report['workedComparisonContentUnchanged']
                  assert placement['proofDataAndCosineAnimationUnchanged']
                  assert patterns['originalChapterOutsideGalleryUnchanged']
                  assert numbers['newtonIntegratedTerms'][:4]==['1/2','-1/48','-1/1280','-1/14336']
                  assert len(patterns['comparisons'])==15
                  for row in patterns['comparisons']:
                      lo,hi=map(Q,row['imaginaryBox']);a,b=map(Q,row['imaginaryDisplay']);assert a<=lo<=hi<=b
                      mantissa,e=row['radiusDisplay'].split(' × 10^')
                      assert Q(mantissa)*Q(10)**int(e)>=Q(row['radius'])
                  home=get('/index.html',True).decode();chapter=get('/ch-foundations.html',True).decode()
                  catalogue=get('/pi-computations.html',True).decode();worked=get('/cosine.html',True).decode()
                  assert '<em>Analysis</em>' in home and 'An alternative foundation to Calculus' in home
                  assert 'class="pi-teaser"' not in home and 'class="pi-formula-card"' not in home
                  assert 'ch-foundations.html#pi-computations' in home
                  assert chapter.count('class="pi-formula-card"')==7 and 'id="pi-cosine"' not in chapter
                  assert chapter.count('class="pi-computation-method"')==5
                  assert '<h3>Arctangent</h3>' in chapter and group['mainFormula'] in chapter
                  assert 'Ways to compute arctan(1)' in chapter
                  assert 'id="pi-machin"' in chapter and '<h4>Machin</h4>' in chapter
                  assert r'\frac{i\pi}{2}=\operatorname{Log}(i)' in chapter
                  assert r'1\cdot1\cdot3' in chapter and r'(1/2)^7' in chapter
                  assert 'Three ways to compute Log(i)' in chapter
                  h=chapter.index('id="rem:sources-of-raw-reals"');g=chapter.index('id="pi-computations"')
                  assert h<g and 'Other examples' in chapter[h:g]
                  assert '0;url=ch-foundations.html#pi-computations' in catalogue
                  assert 'data-animation="cosine"' in worked
                  a=report['cosineAnimation'];assert a['fixedEndpoint'] and a['upperLimit']=='1/2'
                  assert a['xPixelsPerUnit']==a['yPixelsPerUnit']==300
                  image=get('/reading/animations/cosine.gif',True)
                  assert hashlib.sha256(image).hexdigest()==a['gifSha256']
                  assert get('/reading/manifest.json')['proofSourceCommit']==os.environ['SOURCE_SHA']
                  geometry=get('/reading/rational-geometry-edition.json');audit=get('/reading/rational-geometry.json')
                  assert geometry['documentationRevision']==geometry['newProofSourceCommit']==revision
                  assert geometry['baseProofSourceCommit']==os.environ['SOURCE_SHA']
                  assert all(audit['checks'].values()) and all(geometry['checks'].values())
                  assert geometry['integralDefinitionsUnchanged'] and geometry['chapterOneUnchanged']
                  assert geometry['earlierTheoremEntriesUnchanged']
                  assert len(audit['declarations'])==49 and len(audit['audits'])==24
                  assert all('sorryAx' not in r['axioms'] for r in audit['audits'])
                  page=get('/ch-circle-sphere.html',True).decode();maps=get('/reading/maps.json')
                  headings=['A quarter-circle computation','Area from ordered rational vectors',
                    'Polygons and the choice of starting vertex','The geometric meaning of the computation',
                    'Circumference and sector length']
                  positions=[page.index(x) for x in headings];assert positions==sorted(positions)
                  for target in geometry['newTheoremMaps']:
                      assert 'data-proof-map="'+target+'"' in page
                      assert maps['theorems'][target]['verifiedGraph']
                      assert maps['theorems'][target]['proofSourceCommit']==revision
                  assert maps['proofSourceCommit']==os.environ['SOURCE_SHA']
                  fundamental=get('/reading/fundamental-matrix-edition.json')
                  assert fundamental['documentationRevision']==revision
                  assert fundamental['proofSourceCommit']==os.environ['SOURCE_SHA']
                  assert not fundamental['newLeanProofsClaimed'] and not fundamental['leanSourceModified']
                  assert all(fundamental['checks'].values())
                  fundamental_html=get('/fundamental-matrix.html',True)
                  assert hashlib.sha256(fundamental_html).hexdigest()==fundamental['pageSha256']
                  assert 'fundamental-matrix.html' in home
                  assert 'fundamental-matrix.html' in get('/ch-differential-equations.html',True).decode()
                  leibniz=get('/reading/leibniz-benchmark.json')
                  assert leibniz['proofSourceCommit']==revision
                  assert leibniz['independentProofPaths'] and leibniz['allPreviousContentPreserved']
                  assert leibniz['interactiveGraphAdded']
                  graph=get('/reading/leibniz-graph-publication.json')
                  assert graph['documentationRevision']==revision
                  assert all(graph['checks'].values()) and graph['bundleCount']==21
                  assert graph['newLeanProofsClaimed'] and graph['cosinePrimitiveViewerPattern']
                  transmutation=get('/reading/leibniz-transmutation.json')
                  assert transmutation['proofSourceCommit']==revision
                  assert transmutation['modernReconstruction'] and transmutation['powerQuadratureShared']
                  assert not transmutation['mathlibDependency'] and not transmutation['geometricBridgeUsesCalculus']
                  for name,expected in transmutation['artifactHashes'].items():
                      assert hashlib.sha256(get('/'+name,True)).hexdigest()==expected,name
                  for name,expected in graph['artifactHashes'].items():
                      assert hashlib.sha256(get('/'+name,True)).hexdigest()==expected,name
                  series=get('/ch-infinite-series.html',True)
                  assert hashlib.sha256(series).hexdigest()==leibniz['pageSha256']
                  assert b'id="leibniz-geometric-benchmark"' in series
                  algebraic=get('/reading/algebraic-ode-edition.json')
                  assert algebraic['proofSourceCommit']==revision
                  assert algebraic['allPreviousContentPreserved'] and not algebraic['generalClassificationProved']
                  assert not algebraic['mathlibDependency'] and len(algebraic['auditedDeclarations'])==82
                  algebraic_html=get('/fuchs-painleve.html',True)
                  assert hashlib.sha256(algebraic_html).hexdigest()==algebraic['pageSha256']
                  assert 'fuchs-painleve.html' in home
                  assert 'fuchs-painleve.html' in get('/ch-differential-equations.html',True).decode()
                  cauchy=get('/reading/cauchy-arctan-publication.json')
                  assert cauchy['nativeProofRevision']==revision and all(cauchy['checks'].values())
                  assert not cauchy['mathlibDependency'] and not cauchy['nativeGeneralResidueTheorem']
                  assert not cauchy['nativeCauchyFormula']
                  for name,expected in cauchy['artifactHashes'].items():
                      assert hashlib.sha256(get('/'+name,True)).hexdigest()==expected,name
                  assert hashlib.sha256(get('/ch-complex-paths.html',True)).hexdigest()==cauchy['chapterSha256']
                  zeta=get('/reading/zeta-real-edition.json')
                  assert zeta['proofSourceCommit']==revision and zeta['realInputsAboveOne']
                  assert zeta['allPreviousContentPreserved'] and len(zeta['auditedDeclarations'])==33
                  assert zeta['baselProved'] and zeta['primesFromPiSquaredIrrationality']
                  assert not zeta['piSquaredIrrationalityProved']
                  assert not zeta['mathlibDependency'] and not zeta['logExpBridgeProved'] and not zeta['analyticContinuationProved']
                  assert hashlib.sha256(get('/zeta-real.html',True)).hexdigest()==zeta['pageSha256']
                  assert hashlib.sha256(get('/reading/zeta-real-axioms.log',True)).hexdigest()==zeta['auditSha256']
                  assert 'zeta-real.html' in home and 'zeta-real.html' in get('/ch-transforms-zeta.html',True).decode()
                  print('LIVE ZETA:',base+'/zeta-real.html')
                  print('LIVE CAUCHY:',base+'/cauchy-arctan.html')
                  print('LIVE FUCHS-PAINLEVE:',base+'/fuchs-painleve.html')
                  print('LIVE TRANSMUTATION:',base+'/leibniz-transmutation.html')

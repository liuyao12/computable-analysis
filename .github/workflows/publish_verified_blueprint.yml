name: Publish verified proof blueprint

# Publish only a pinned, proof-checked and browser-tested static artifact.
# The theorem branch is not merged; Pages permissions/protections are unchanged.
on:
  push:
    branches: [main]
    paths: ['.github/workflows/publish_verified_blueprint.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
  pages: write
  id-token: write
concurrency:
  group: pages-verified-proof-publication
  cancel-in-progress: false
env:
  SOURCE_RUN: '34945179551'
  SOURCE_SHA: '5bfdda093c7e59d10ab0a687b2d077583081a6b7'

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Verify proof builds, definition audit, and browser regressions
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json, os, time, urllib.request
          base = 'https://api.github.com/repos/' + os.environ['GITHUB_REPOSITORY']
          def get(path):
              request = urllib.request.Request(base + path, headers={
                  'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
                  'Accept': 'application/vnd.github+json'})
              with urllib.request.urlopen(request, timeout=30) as response:
                  return json.load(response)
          run_id = os.environ['SOURCE_RUN']
          for attempt in range(180):
              run = get('/actions/runs/' + run_id)
              assert run['head_sha'] == os.environ['SOURCE_SHA']
              assert run['name'] == 'Three-proof blueprint'
              if run['status'] == 'completed':
                  break
              time.sleep(5)
          assert run['conclusion'] == 'success', 'Source run must finish successfully'
          job = next(j for j in get('/actions/runs/' + run_id + '/jobs')['jobs'] if j['name'] == 'verify')
          assert job['conclusion'] == 'success'
          steps = {s['name']: s['conclusion'] for s in job['steps']}
          for step in ['Build native basepoint proofs and exponential companion',
                       'Build all three proofs in one environment',
                       'Check identical statement and independent proof routes',
                       'Render blueprint and test the three-route graph',
                       'Test Lean statement boxes and Mathlib Real shading']:
              assert steps[step] == 'success', step
          print('Verified proof roots, readback equations, independent definitions, graph bundles and browser tests')
          PY
      - uses: actions/download-artifact@v8
        with:
          name: github-pages
          run-id: ${{ env.SOURCE_RUN }}
          github-token: ${{ github.token }}
          path: downloaded
      - name: Inspect all bundles and the independent definitions
        run: |
          python3 - <<'PY'
          import json, os, pathlib, re, tarfile
          with tarfile.open('downloaded/artifact.tar') as archive:
              archive.extractall('site', filter='data')
          root = pathlib.Path('site')
          def load(path): return json.loads((root/path).read_text())
          summary = load('three-proofs/summary.json')
          audit = load('three-proofs/definition-audit.json')
          details = load('three-proofs/node-details.json')
          exported = {d['name']: d for d in load('three-proofs/blueprint-statements.json')['declarations']}
          bench = load('proof-bench/data.json')
          sha = os.environ['SOURCE_SHA']
          assert summary['sourceCommit'] == audit['sourceCommit'] == bench['sourceCommit'] == sha
          assert all(summary['checks'].values()) and all(bench['checks'].values())
          assert audit['passed'] and audit['nodesAudited'] == len(details) == 19
          assert audit['piUsesArctanNotCosine'] and audit['visibleAnchorsCovered']
          assert audit['closedInverseRawHasNoPiEvaluator']
          assert all(c['noEndpointTheorem'] and c['noMathlib'] for c in audit['definitions'])
          display = summary['nodeDisplay']
          assert display['version'] == 5 and display['groupedStatements'] and display['statementFirst']
          assert display['rationalRoot'] == 'Rat' and display['separateProofLanes']
          assert display['syntaxHighlighting'] == 'lossless Lean lexer'
          count = 0
          for item in details.values():
              names = [name for group in item['groups'] for name in group['names']]
              assert names == [d['name'] for d in item['declarations']]
              assert set(item['anchors']) <= set(names)
              assert set(item['strategy']['groups']) == {g['title'] for g in item['groups']}
              count += len(names)
              for d in item['declarations']:
                  assert all(d[k] == exported[d['name']][k] for k in ['name','kind','type','value'])
                  assert d['ownerModule']
              assert not re.search(r'[=∫≃↔πⁱ₀ᵗ]|:=|[SCIA]\(', item['title'])
          assert count == display['declarationOccurrences'] == 175
          assert 'namespace' in details['def:c3-pi']['strategy']['summary']
          assert 'return zero' in details['def:c3-trig']['strategy']['summary']
          assert all(name in exported for name in audit['stageEquations'].values())
          target = details['thm:c3-primitive']
          assert target['classification'] == 'mixed'
          assert [bool(target['paths'][a]) for a in target['anchors']] == [False,False,True]
          assert len(bench['cases']) == 3
          assert sum(len(c['routes']) for c in bench['cases'].values()) == 8
          for c in bench['cases'].values():
              for r in c['routes'].values():
                  assert 'sorryAx' not in r['axioms']
          graph = (root/'cosine-primitive-graph.html').read_text()
          assert graph.count('id="thm:c3-primitive_modal"') == 1
          assert 'bp-provenance' in graph and 'bp-namespace' in graph
          assert 'LeanSnippet.highlight(code)' in graph
          assert (root/'ch-definition-audit.html').is_file()
          def redirect(path, target):
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_text('<!doctype html><html><head><meta charset="utf-8">'
                  '<meta http-equiv="refresh" content="0;url=' + target + '">'
                  '<title>Three proofs of one cosine primitive</title></head><body>'
                  '<p>Open <a href="' + target + '">the updated dependency graph</a>.</p></body></html>')
          redirect(root/'proof-comparison/index.html', '../cosine-primitive-graph.html')
          redirect(root/'ch-two-cosine-proofs.html', 'ch-three-cosine-proofs.html')
          print('Validated 175 exact declarations, all 19 bundles, definition independence and unchanged proof roots:', sha)
          PY
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
          retention-days: 7

  deploy:
    needs: prepare
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify live definition audit and exact stages
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          python3 - <<'PY'
          import json, os, time, urllib.request
          sha = os.environ['SOURCE_SHA']
          base = os.environ['PAGE_URL'].rstrip('/')
          def get(path):
              with urllib.request.urlopen(base+path+'?source='+sha, timeout=20) as response:
                  return json.load(response)
          last = None
          for attempt in range(12):
              try:
                  summary = get('/three-proofs/summary.json')
                  audit = get('/three-proofs/definition-audit.json')
                  details = get('/three-proofs/node-details.json')
                  assert summary['sourceCommit'] == audit['sourceCommit'] == sha
                  assert all(summary['checks'].values()) and audit['passed']
                  assert summary['nodeDisplay']['declarationOccurrences'] == 175
                  assert audit['nodesAudited'] == len(details) == 19
                  assert 'namespace' in details['def:c3-pi']['strategy']['summary']
                  assert 'return zero' in details['def:c3-trig']['strategy']['summary']
                  with urllib.request.urlopen(base+'/cosine-primitive-graph.html?source='+sha,timeout=20) as response:
                      graph = response.read().decode()
                  assert 'bp-provenance' in graph and 'bp-namespace' in graph
                  assert graph.count('id="thm:c3-primitive_modal"') == 1
                  print('LIVE:', base+'/cosine-primitive-graph.html')
                  print('Verified source:', sha)
                  print('Audited nodes/reference paths:', audit['nodesAudited'], audit['edgeWitnessesAudited'])
                  print('Independent pi and S/C definitions, chart restrictions, and literal stage equations are live')
                  break
              except Exception as exc:
                  last = str(exc)
                  time.sleep(5)
          else:
              raise SystemExit('Live definition verification failed: '+str(last))
          PY

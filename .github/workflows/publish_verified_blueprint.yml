name: Publish verified proof blueprint

# Documentation-only publication of an already proof-checked and browser-tested
# artifact. Does not merge the theorem branch or change Pages protections.
on:
  push:
    branches: [main]
    paths: ['.github/workflows/publish_verified_blueprint.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
  pages: write
  id-token: write
concurrency:
  group: pages-verified-proof-publication
  cancel-in-progress: false
env:
  SOURCE_RUN: '35056741522'
  SOURCE_SHA: '289b4936bbbe54fe1e6a8fddd207959ce43fc475'
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Verify proofs, mathematical images, declaration preservation and browser tests
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json, os, time, urllib.request
          base='https://api.github.com/repos/'+os.environ['GITHUB_REPOSITORY']
          def get(path):
              req=urllib.request.Request(base+path,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'})
              with urllib.request.urlopen(req,timeout=30) as r:return json.load(r)
          rid=os.environ['SOURCE_RUN']
          for attempt in range(180):
              run=get('/actions/runs/'+rid)
              assert run['head_sha']==os.environ['SOURCE_SHA'] and run['name']=='Three-proof blueprint'
              if run['status']=='completed':break
              time.sleep(5)
          assert run['conclusion']=='success','Refusing to publish a failed or incomplete source build'
          job=next(j for j in get('/actions/runs/'+rid+'/jobs')['jobs'] if j['name']=='verify')
          assert job['conclusion']=='success'
          steps={s['name']:s['conclusion'] for s in job['steps']}
          for name in ['Build native basepoint proofs and exponential companion','Build all three proofs in one environment','Check identical statement and independent proof routes','Render blueprint and test the three-route graph','Test Lean statement boxes and Mathlib Real shading','Audit the native computability boundary','Build and verify the mathematical reader']:
              assert steps[name]=='success',name
          print('Verified all mathematical, proof, preservation, illustration and browser checks')
          PY
      - uses: actions/download-artifact@v8
        with:
          name: github-pages
          run-id: ${{ env.SOURCE_RUN }}
          github-token: ${{ github.token }}
          path: downloaded
      - name: Inspect the exact geometric reader artifact
        run: |
          python3 - <<'PY'
          import hashlib,json,os,pathlib,tarfile,xml.etree.ElementTree as ET
          from fractions import Fraction as Q
          with tarfile.open('downloaded/artifact.tar') as t:t.extractall('site',filter='data')
          root=pathlib.Path('site')
          def read(p):return json.loads((root/p).read_text())
          m=read('reading/manifest.json');g=read('reading/maps.json');a=read('reading/animations/manifest.json')
          assert m['sourceCommit']==g['sourceCommit']==m['proofSourceCommit']==os.environ['SOURCE_SHA']
          assert m['preservedFirstTwo'] and m['compilerAuditPresent']
          assert m['chapters']==17 and m['theoremMaps']==12 and m['checkedPairedMaps']==1
          assert all(g['checks'].values())
          b=g['bundles'];assert 'lem:c3-inverse' not in b and b['def:c3-trig']['title']=='Sine and cosine'
          assert len(b['def:c3-trig']['declarations'])==37
          assert 'ComputableAnalysis.ClosedArctanInverse.provider' in b['def:c3-trig']['anchors']
          info=g['geometricPresentation']
          assert info['version']==2 and info['piDefinition']=='4 A(1)'
          assert info['originalTheoremProgramsAndProofsUnchanged']
          assert info['verticalSubdivisionProjected'] and info['independentCosineNumerics']
          assert info['numericDriverIsLeanStageExecution'] is False
          assert info['integralExposition']=='Increasing or decreasing integrands'
          assert b['def:c3-integrals']['title']=='Integrals of monotone functions'
          for label,name in [('def:c3-arctan','arctan'),('def:c3-integrals','cosine'),('thm:c3-primitive','cosine'),('lem:c3-concavity','secants')]:
              assert b[label]['illustration']['id']==name
          for name in ['arctan','cosine','secants']:
              for suffix in ['gif','png']:
                  p=root/'reading/animations'/f'{name}.{suffix}'
                  assert hashlib.sha256(p.read_bytes()).hexdigest()==a['files'][p.name]
                  if suffix=='gif':assert p.read_bytes()[:6] in [b'GIF89a',b'GIF87a'] and p.stat().st_size>10000
          assert not (root/'reading/animations/concave.gif').exists()
          for r in a['arctan']:
              n=r['subarcs'];u=Q(r['u']);assert u==Q(2,3)
              vertical=[list(map(Q,p)) for p in r['verticalPoints']]
              assert vertical==[[Q(0),j*u/n] for j in range(n+1)]
              for (_,v),(x,y) in zip(vertical,[list(map(Q,p)) for p in r['projectedPoints']]):
                  assert x*x+y*y==1 and y==v*(x+1)
          for r in a['cosine']+a['cosineTable']:
              assert max(Q(r['lower']),Q(r['endpointLower']))<=min(Q(r['upper']),Q(r['endpointUpper']))
          last=a['cosineTable'][-1]
          assert last['cells']==512 and last['lowerDisplay']=='0.2755015' and last['upperDisplay']=='0.2758272'
          chapter=(root/'cosine.html').read_text()
          assert 'data-animation="cosine"' in chapter and '0.2755015' in chapter
          assert 'not executions of the literal Lean stage programs' in chapter
          for view,p in g['theorems']['thm:c3-primitive']['views'].items():
              doc=ET.fromstring((root/p).read_text());nodes=[x.get('data-node') for x in doc.iter() if x.get('data-node')]
              assert 'lem:c3-inverse' not in nodes and nodes.count('thm:c3-primitive')==1
              assert sum(x.get('data-edge-kind')=='statement' for x in doc.iter())==4
          native=read('reading/native-computability.json')
          assert native['nativeNoncomputableClosureCheck'] and native['nativeMathlibFree'] and native['noSorryAx']
          assert all(x['identicalMathematicalText'] for x in read('reading/preservation.json')['rendered'].values())
          assert (root/'proof-bench/data.json').read_bytes()==(root/'reference/proof-bench/data.json').read_bytes()
          print('Validated three GIFs, exact vertical projections, independent cosine bounds, monotone integration, secant derivatives and unchanged proofs')
          PY
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
          retention-days: 7
  deploy:
    needs: prepare
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify live animations and geometric panels
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          python3 - <<'PY'
          import hashlib,json,os,time,urllib.request
          sha=os.environ['SOURCE_SHA'];base=os.environ['PAGE_URL'].rstrip('/')
          def get(path,binary=False):
              with urllib.request.urlopen(base+path+'?source='+sha,timeout=25) as r:
                  return r.read() if binary else json.load(r)
          last=None
          for attempt in range(12):
              try:
                  m=get('/reading/manifest.json');g=get('/reading/maps.json');a=get('/reading/animations/manifest.json')
                  assert m['sourceCommit']==g['sourceCommit']==sha
                  assert m['preservedFirstTwo'] and m['compilerAuditPresent'] and all(g['checks'].values())
                  assert 'lem:c3-inverse' not in g['bundles']
                  assert g['bundles']['def:c3-trig']['title']=='Sine and cosine'
                  info=g['geometricPresentation']
                  assert info['piDefinition']=='4 A(1)' and info['verticalSubdivisionProjected']
                  assert info['integralExposition']=='Increasing or decreasing integrands'
                  assert info['independentCosineNumerics'] and not info['numericDriverIsLeanStageExecution']
                  for name in ['arctan','cosine','secants']:
                      image=get('/reading/animations/'+name+'.gif',True)
                      assert image[:6] in [b'GIF89a',b'GIF87a'] and len(image)>10000
                      assert hashlib.sha256(image).hexdigest()==a['files'][name+'.gif']
                  chapter=get('/cosine.html',True)
                  assert b'data-animation="arctan"' in chapter and b'data-animation="cosine"' in chapter
                  assert b'0.2755015' in chapter and b'0.2756644' in chapter
                  print('LIVE MAP:',base+'/proof-map.html?theorem=thm:c3-primitive')
                  print('LIVE CHAPTER:',base+'/cosine.html#numerical-comparison')
                  print('Verified source:',sha)
                  print('Three GIFs; vertical subdivision and projections; independent cosine bounds; monotone integration; convex/concave secant derivatives; original proofs unchanged')
                  break
              except Exception as e:
                  last=str(e);time.sleep(5)
          else:raise SystemExit('Live check failed: '+str(last))
          PY

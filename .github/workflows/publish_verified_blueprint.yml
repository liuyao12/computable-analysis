name: Publish verified proof blueprint

# Publish only the pinned proof-checked and browser-tested static artifact.
# No theorem branch is merged and Pages permissions/protections are unchanged.
on:
  push:
    branches: [main]
    paths: ['.github/workflows/publish_verified_blueprint.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
  pages: write
  id-token: write
concurrency:
  group: pages-verified-proof-publication
  cancel-in-progress: false
env:
  SOURCE_RUN: '34936578264'
  SOURCE_SHA: '8903da391c3915ab17095d8f520b4f90d28aeb53'

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Verify source proofs, benchmark accounting, and browser regressions
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json, os, time, urllib.request
          base = 'https://api.github.com/repos/' + os.environ['GITHUB_REPOSITORY']
          def get(path):
              req = urllib.request.Request(base + path, headers={
                  'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
                  'Accept': 'application/vnd.github+json'})
              with urllib.request.urlopen(req, timeout=30) as response:
                  return json.load(response)
          run_id = os.environ['SOURCE_RUN']
          for attempt in range(180):
              run = get('/actions/runs/' + run_id)
              assert run['head_sha'] == os.environ['SOURCE_SHA']
              assert run['name'] == 'Three-proof blueprint'
              if run['status'] == 'completed':
                  break
              time.sleep(5)
          assert run['conclusion'] == 'success', 'Source run must complete successfully'
          job = next(j for j in get('/actions/runs/' + run_id + '/jobs')['jobs'] if j['name'] == 'verify')
          assert job['conclusion'] == 'success'
          steps = {s['name']: s['conclusion'] for s in job['steps']}
          for step in ['Build native basepoint proofs and exponential companion',
                       'Build all three proofs in one environment',
                       'Check identical statement and independent proof routes',
                       'Render blueprint and test the three-route graph',
                       'Test Lean statement boxes and Mathlib Real shading']:
              assert steps[step] == 'success', step
          print('Verified independent proof roots, full size export, accounting tests, strategy panels and browser controls')
          PY
      - uses: actions/download-artifact@v8
        with:
          name: github-pages
          run-id: ${{ env.SOURCE_RUN }}
          github-token: ${{ github.token }}
          path: downloaded
      - name: Inspect the benchmark and guided statements
        run: |
          python3 - <<'PY'
          import json, os, pathlib, re, tarfile
          with tarfile.open('downloaded/artifact.tar') as archive:
              archive.extractall('site', filter='data')
          root = pathlib.Path('site')
          summary = json.loads((root/'three-proofs/summary.json').read_text())
          details = json.loads((root/'three-proofs/node-details.json').read_text())
          exported = {d['name']: d for d in json.loads((root/'three-proofs/blueprint-statements.json').read_text())['declarations']}
          bench = json.loads((root/'proof-bench/data.json').read_text())
          sha = os.environ['SOURCE_SHA']
          assert summary['sourceCommit'] == bench['sourceCommit'] == sha
          assert all(summary['checks'].values()) and all(bench['checks'].values())
          display = summary['nodeDisplay']
          assert display['version'] == 5 and display['groupedStatements'] and display['statementFirst']
          assert display['rationalRoot'] == 'Rat' and display['separateProofLanes']
          assert display['syntaxHighlighting'] == 'lossless Lean lexer'
          assert display['strategyGuides'] and display['strategyNodes'] == len(details) == 19
          count = 0
          for item in details.values():
              names = [name for g in item['groups'] for name in g['names']]
              assert names == [d['name'] for d in item['declarations']]
              assert set(item['strategy']['groups']) == {g['title'] for g in item['groups']}
              assert item['strategy']['role'] and item['strategy']['summary']
              count += len(names)
              for d in item['declarations']:
                  assert all(d[k] == exported[d['name']][k] for k in ['name','kind','type','value'])
              assert not re.search(r'[=∫≃↔πⁱ₀ᵗ]|:=|[SCIA]\(', item['title'])
          assert count == display['declarationOccurrences'] == 141
          target = details['thm:c3-primitive']
          assert target['classification'] == 'mixed'
          assert [bool(target['paths'][a]) for a in target['anchors']] == [False,False,True]
          assert len(bench['cases']) == 3
          assert sum(len(c['routes']) for c in bench['cases'].values()) == 8
          assert set(bench['cases']['cosine-primitive']['routes']) == {'direct','ftc','mathlib'}
          for c in bench['cases'].values():
              for r in c['routes'].values():
                  assert 'sorryAx' not in r['axioms']
                  for cost in r['sizes'].values():
                      assert sum(o['declarations'] for o in cost['origins'].values()) == cost['declarations']
                      assert sum(o['bodyDag'] for o in cost['origins'].values()) == cost['bodyDag']
          assert len(bench['roadmap']) == 8 and all(c['status'] == 'planned' for c in bench['roadmap'])
          assert all(p['order'] == ['cosine-primitive','cosine-validity'] for p in bench['portfolio'].values())
          graph = (root/'cosine-primitive-graph.html').read_text()
          assert graph.count('id="thm:c3-primitive_modal"') == 1
          assert 'bp-strategy' in graph and 'bp-node-navigation' in graph
          assert 'LeanSnippet.highlight(code)' in graph and 'proof-bench/' in graph
          assert (root/'ch-proof-comparison.html').is_file()
          assert 'proof-bench/' in (root/'index.html').read_text()
          def redirect(path, target):
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_text('<!doctype html><html><head><meta charset="utf-8">'
                  '<meta http-equiv="refresh" content="0;url=' + target + '">'
                  '<title>Three proofs of one cosine primitive</title></head><body>'
                  '<p>Open <a href="' + target + '">the updated dependency graph</a>.</p></body></html>')
          redirect(root/'proof-comparison/index.html', '../cosine-primitive-graph.html')
          redirect(root/'ch-two-cosine-proofs.html', 'ch-three-cosine-proofs.html')
          print('Validated 141 guided Lean statements and eight measured proof declarations at', sha)
          PY
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
          retention-days: 7

  deploy:
    needs: prepare
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify live strategies and proof-size laboratory
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          python3 - <<'PY'
          import json, os, time, urllib.request
          sha = os.environ['SOURCE_SHA']
          base = os.environ['PAGE_URL'].rstrip('/')
          def get(path):
              with urllib.request.urlopen(base+path+'?source='+sha,timeout=20) as response:
                  return json.load(response)
          last = None
          for attempt in range(12):
              try:
                  summary = get('/three-proofs/summary.json')
                  bench = get('/proof-bench/data.json')
                  assert summary['sourceCommit'] == bench['sourceCommit'] == sha
                  assert all(summary['checks'].values()) and all(bench['checks'].values())
                  assert summary['nodeDisplay']['strategyGuides']
                  assert summary['nodeDisplay']['declarationOccurrences'] == 141
                  assert len(bench['cases']) == 3
                  assert sum(len(c['routes']) for c in bench['cases'].values()) == 8
                  details = get('/three-proofs/node-details.json')
                  assert all(item['strategy']['summary'] for item in details.values())
                  with urllib.request.urlopen(base+'/cosine-primitive-graph.html?source='+sha,timeout=20) as response:
                      graph = response.read().decode()
                  assert 'bp-strategy' in graph and 'proof-bench/' in graph
                  assert graph.count('id="thm:c3-primitive_modal"') == 1
                  print('LIVE GRAPH:', base+'/cosine-primitive-graph.html')
                  print('LIVE BENCHMARK:', base+'/proof-bench/')
                  print('Verified source:', sha)
                  for route, r in bench['cases']['cosine-primitive']['routes'].items():
                      print(route, 'final tree/DAG:', r['finalBody']['bodyTree'], r['finalBody']['bodyDag'],
                          'full declarations/body DAG:',r['sizes']['full']['declarations'],r['sizes']['full']['bodyDag'])
                  print('Three matched obligations: one calculus example plus calibration; eight further families are explicitly planned')
                  break
              except Exception as exc:
                  last = str(exc)
                  time.sleep(5)
          else:
              raise SystemExit('Live verification failed: '+str(last))
          PY

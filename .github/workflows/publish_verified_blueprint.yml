name: Publish verified proof blueprint

# Documentation-only publication of the fully verified mathematical reader.
# No theorem branch is merged and Pages protections are unchanged.
on:
  push:
    branches: [main]
    paths: ['.github/workflows/publish_verified_blueprint.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
  pages: write
  id-token: write
concurrency:
  group: pages-verified-proof-publication
  cancel-in-progress: false
env:
  SOURCE_RUN: '35049755258'
  SOURCE_SHA: '8d73f090bcf2d1f505254803c9d1f8bc3ed19cc8'

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Verify mathematics, computational boundary, preserved chapters and reader tests
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json, os, time, urllib.request
          base = 'https://api.github.com/repos/' + os.environ['GITHUB_REPOSITORY']
          def get(path):
              req = urllib.request.Request(base + path, headers={
                  'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
                  'Accept': 'application/vnd.github+json'})
              with urllib.request.urlopen(req, timeout=30) as response:
                  return json.load(response)
          run_id = os.environ['SOURCE_RUN']
          for attempt in range(180):
              run = get('/actions/runs/' + run_id)
              assert run['head_sha'] == os.environ['SOURCE_SHA']
              assert run['name'] == 'Three-proof blueprint'
              if run['status'] == 'completed':
                  break
              time.sleep(5)
          assert run['conclusion'] == 'success', 'Source run must pass all gates before publication'
          job = next(j for j in get('/actions/runs/' + run_id + '/jobs')['jobs'] if j['name'] == 'verify')
          assert job['conclusion'] == 'success'
          steps = {s['name']: s['conclusion'] for s in job['steps']}
          for step in ['Build native basepoint proofs and exponential companion',
                       'Build all three proofs in one environment',
                       'Check identical statement and independent proof routes',
                       'Render blueprint and test the three-route graph',
                       'Test Lean statement boxes and Mathlib Real shading',
                       'Audit the native computability boundary',
                       'Build and verify the mathematical reader']:
              assert steps[step] == 'success', step
          print('Verified proofs, computability, preservation, statement/proof edge semantics and browser tests')
          PY
      - uses: actions/download-artifact@v8
        with:
          name: github-pages
          run-id: ${{ env.SOURCE_RUN }}
          github-token: ${{ github.token }}
          path: downloaded
      - name: Inspect the exact tested reader artifact
        run: |
          python3 - <<'PY'
          import json, os, pathlib, tarfile, xml.etree.ElementTree as ET
          with tarfile.open('downloaded/artifact.tar') as archive:
              archive.extractall('site', filter='data')
          root = pathlib.Path('site')
          def read(path): return json.loads((root/path).read_text())
          sha = os.environ['SOURCE_SHA']
          manifest = read('reading/manifest.json')
          audit = read('reading/native-computability.json')
          boundary = read('reading/native-source-boundary.json')
          preservation = read('reading/preservation.json')
          maps = read('reading/maps.json')
          proof = read('three-proofs/summary.json')
          assert manifest['sourceCommit'] == manifest['proofSourceCommit'] == proof['sourceCommit'] == sha
          assert manifest['preservedFirstTwo'] and manifest['compilerAuditPresent']
          assert manifest['chapters'] == 17 and manifest['theoremMaps'] == 12 and manifest['checkedPairedMaps'] == 1
          assert audit['nativeNoncomputableClosureCheck'] and audit['nativeMathlibFree'] and audit['noSorryAx']
          assert len(audit['roots']) == 8 and all(not r['nativeNoncomputableDependencies'] for r in audit['roots'])
          assert boundary['noNewNativeNoncomputables'] and boundary['chaptersPreserved']
          assert boundary['nativeSourceNoncomputableCount'] == 16
          assert len(preservation['rendered']) == 2
          assert all(r['identicalMathematicalText'] and r['originalTextHash'] == r['readerTextHash'] for r in preservation['rendered'].values())
          assert preservation['sources']['files'] == {
              'blueprint/src/01-foundations.tex':'8654db7f985b149c4afad6e8251c4a758c462f648dcbfb2e0fc3d6636b5e5897',
              'blueprint/src/02-circle-sphere.tex':'e0243bdc3827fc0c0fa1deae5a8b58b55c43328f8e17eeb4ec63523e756cea31'}
          assert all(maps['checks'].values()) and all(proof['checks'].values())
          assert sum(t['checkedComparison'] for t in maps['theorems'].values()) == 1
          assert len(maps['theorems']) == 12
          semantics = maps['edgeSemantics']
          assert manifest['edgeSemanticsVersion'] == semantics['version'] == 1
          assert semantics['statementDefinitionsVerified'] and semantics['proofBodyEntryVerified']
          assert semantics['oneAcyclicSinkInEveryView'] and semantics['unchangedProofTermsAndMetrics']
          bundle = maps['bundles']['def:c3-intervals']
          assert bundle['title'] == 'Computable number'
          assert [g['title'] for g in bundle['groups']] == ['Rational intervals','A computable number','Equality, order and refinement']
          edges = [e for e in maps['witnesses'] if e['kind'] == 'statement']
          assert len(edges) == 4 and {e['input'] for e in edges} == {'S','C','pi','integral'}
          assert all(e['witness'][-1] == 'ComputableAnalysis.CosinePrimitive.Statement' and e['route'] is None for e in edges)
          for view, path in maps['theorems']['thm:c3-primitive']['views'].items():
              doc = ET.fromstring((root/path).read_text())
              assert sum(e.get('data-node') == 'thm:c3-primitive' for e in doc.iter()) == 1
              arrows = [e for e in doc.iter() if e.get('data-edge-kind') == 'statement']
              assert len(arrows) == 3
              assert {e.get('data-edge').split('->')[0] for e in arrows} == {'def:c3-trig','def:c3-pi','def:c3-integral'}
          home = (root/'index.html').read_text()
          assert 'Analysis by construction.' in home and 'reading/book.css' in home and 'theme-white.css' not in home
          assert 'data-proof-map="thm:c3-primitive"' in (root/'cosine.html').read_text()
          for path in ['reference/index.html','reference/dep_graph_document.html','proof-bench/index.html',
                       'proof-map.html','ch-foundations.html','ch-circle-sphere.html','reading/proof-edges.css']:
              assert (root/path).is_file(),path
          assert 'http-equiv="refresh"' in (root/'cosine-primitive-graph.html').read_text()
          assert (root/'proof-bench/data.json').read_bytes() == (root/'reference/proof-bench/data.json').read_bytes()
          print('Validated computable-number bundle, four statement inputs, neutral direct arrows in every proof route, preserved chapters and unchanged proof measurements')
          PY
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
          retention-days: 7

  deploy:
    needs: prepare
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify the live statement and proof arrows
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          python3 - <<'PY'
          import json, os, time, urllib.request
          sha = os.environ['SOURCE_SHA']
          base = os.environ['PAGE_URL'].rstrip('/')
          def get(path, parse=True):
              with urllib.request.urlopen(base+path+'?source='+sha,timeout=20) as response:
                  return json.load(response) if parse else response.read().decode()
          last = None
          for attempt in range(12):
              try:
                  manifest = get('/reading/manifest.json')
                  maps = get('/reading/maps.json')
                  assert manifest['sourceCommit'] == maps['sourceCommit'] == sha
                  assert manifest['compilerAuditPresent'] and manifest['preservedFirstTwo']
                  assert maps['edgeSemantics']['statementDefinitionsVerified']
                  assert maps['edgeSemantics']['proofBodyEntryVerified']
                  assert maps['bundles']['def:c3-intervals']['title'] == 'Computable number'
                  statements = [e for e in maps['witnesses'] if e['kind'] == 'statement']
                  assert {e['input'] for e in statements} == {'S','C','pi','integral'}
                  for view in ['all','0','1','2']:
                      svg = get('/reading/cosine-'+view+'.svg',False)
                      assert svg.count('data-edge-kind="statement"') == 3
                  assert 'proof-edges.css' in get('/proof-map.html',False)
                  print('LIVE MAP:',base+'/proof-map.html?theorem=thm:c3-primitive')
                  print('Verified source:',sha)
                  print('Computable number; interval/evaluator/equality sequence; four statement inputs on three neutral bundle arrows; colors reserved for proof use')
                  break
              except Exception as exc:
                  last = str(exc)
                  time.sleep(5)
          else:
              raise SystemExit('Live reader verification failed: '+str(last))
          PY

name: Publish verified proof blueprint

# Documentation-only publication of the exact verified static artifact.
# Does not merge mathematical source branches or alter Pages protections.
on:
  push:
    branches: [main]
    paths: ['.github/workflows/publish_verified_blueprint.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
  pages: write
  id-token: write
concurrency:
  group: pages-verified-proof-publication
  cancel-in-progress: false
env:
  SOURCE_RUN: '35069758139'
  SOURCE_SHA: 'e91fbeb82d15a2069f2f54a90ea80138b9e9e84c'
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Verify original proofs, inline comparison and Mathlib map checks
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json,os,time,urllib.request
          base='https://api.github.com/repos/'+os.environ['GITHUB_REPOSITORY']
          def get(path):
              req=urllib.request.Request(base+path,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'})
              with urllib.request.urlopen(req,timeout=30) as r:return json.load(r)
          rid=os.environ['SOURCE_RUN']
          for attempt in range(180):
              run=get('/actions/runs/'+rid)
              assert run['head_sha']==os.environ['SOURCE_SHA'] and run['name']=='Three-proof blueprint'
              if run['status']=='completed':break
              time.sleep(5)
          assert run['conclusion']=='success','Refusing to publish an incomplete or failed build'
          job=next(j for j in get('/actions/runs/'+rid+'/jobs')['jobs'] if j['name']=='verify')
          assert job['conclusion']=='success'
          steps={s['name']:s['conclusion'] for s in job['steps']}
          for name in ['Build native basepoint proofs and exponential companion',
                       'Build all three proofs in one environment',
                       'Check identical statement and independent proof routes',
                       'Render blueprint and test the three-route graph',
                       'Test Lean statement boxes and Mathlib Real shading',
                       'Audit the native computability boundary',
                       'Build and verify the mathematical reader',
                       'Verify the supplied-schedule lemmas and refined proof map',
                       'Verify the inline comparison and Mathlib foundations',
                       'Verify the radical evaluator and product theorem']:
              assert steps[name]=='success',name
          print('Verified old proofs, exact Mathlib declarations, reference witnesses, inline accounting, and browser/iframe tests')
          PY
      - uses: actions/download-artifact@v8
        with:
          name: github-pages
          run-id: ${{ env.SOURCE_RUN }}
          github-token: ${{ github.token }}
          path: downloaded
      - name: Inspect verified counts, foundation nodes and preserved proofs
        run: |
          python3 - <<'PY'
          import hashlib,json,os,pathlib,tarfile,xml.etree.ElementTree as ET
          with tarfile.open('downloaded/artifact.tar') as t:t.extractall('site',filter='data')
          root=pathlib.Path('site')
          def read(path):return json.loads((root/path).read_text())
          sha=os.environ['SOURCE_SHA'];m=read('reading/manifest.json');maps=read('reading/maps.json')
          comp=read('reading/map-comparison.json');extra=read('reading/mathlib-expansion.json')
          s=read('reading/schedule-proof-map.json');export=read('reading/mathlib-map-statements.json')
          assert m['sourceCommit']==maps['sourceCommit']==comp['sourceCommit']==extra['sourceCommit']==m['proofSourceCommit']==sha
          assert m['preservedFirstTwo'] and m['compilerAuditPresent']
          assert m['chapters']==17 and m['theoremMaps']==13 and m['checkedPairedMaps']==1 and m['checkedSingleProofMaps']==1
          assert all(maps['checks'].values()) and all(extra['checks'].values()) and all(export['checks'].values())
          assert len(export['declarations'])==26 and len(extra['additionalBundles'])==4
          assert extra['mathlibCommit']=='51e6992efd06126df61a496bebf8f49482a4e129'
          assert comp['noNewMeasurementRoots'] and comp['codeLineLabel']=='Mapped source LOC'
          rows=comp['cases']['identity']['routes'];routes=comp['routeOrder']
          assert [rows[r]['costs']['full']['declarations'] for r in routes]==[5596,5674,42849]
          assert [rows[r]['costs']['full']['codeLines'] for r in routes]==[8955,9124,81510]
          for case in comp['cases'].values():
              for r in case['routes'].values():
                  for cost in r['costs'].values():
                      assert cost['mappedDeclarations']+cost['unmappedDeclarations']==cost['declarations']
                      assert sum(o['codeLines'] for o in cost['origins'].values())==cost['codeLines']
                      assert sum(o['declarations'] for o in cost['origins'].values())==cost['declarations']
          target='thm:c3-primitive';valid='lem:c3-construction-valid';ftc='thm:c3-mathlib-ftc'
          assert maps['bundles'][target]['title']=='Cosine primitive'
          assert s['noIntegrabilityPredicateIntroduced'] and s['mathlibValidityIsSeparate']
          for view,path in maps['theorems'][target]['views'].items():
              doc=ET.parse(root/path);nodes=[x.get('data-node') for x in doc.iter() if x.get('data-node')]
              edges=[x.get('data-edge') for x in doc.iter() if x.get('data-edge')]
              assert nodes.count(target)==1 and nodes.count(valid)==1
              assert sum(x.get('data-edge-kind')=='statement' for x in doc.iter())==4
              assert (ftc in nodes)==(view in ['all','2','companions'])
              if ftc in nodes:
                  assert ftc+'->lem:c3-mftc' in edges
                  assert 'def:c3-mathlib-bochner->def:c3-mathlib-interval' in edges
                  assert 'def:c3-mathlib-interval->'+ftc in edges
              if view=='2':assert valid+'->'+target not in edges
          assert hashlib.sha256((root/'proof-bench/data.json').read_bytes()).hexdigest()==extra['benchmarkSha256']==s['proofMetricsFileSha256']
          html=(root/'proof-map.html').read_text()
          assert 'reading/map-comparison.css' in html and 'reading/map-comparison.js' in html
          assert 'Mapped source LOC' in comp['codeLineLabel']
          assert 'id="the-chosen-schedule"' in (root/'cosine.html').read_text()
          assert all(read('reading/dyadic-evaluation.json')['checks'].values())
          for path,h in maps['dyadicEvaluation']['unchangedArtifacts'].items():
              assert hashlib.sha256((root/path).read_bytes()).hexdigest()==h
          native=read('reading/native-computability.json')
          assert native['nativeNoncomputableClosureCheck'] and native['nativeMathlibFree'] and native['noSorryAx']
          assert all(p['identicalMathematicalText'] for p in read('reading/preservation.json')['rendered'].values())
          print('Validated inline declaration/LOC comparison, explicit source coverage, Bochner/interval/FTC nodes, and unchanged mathematical proofs')
          PY
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
          retention-days: 7
  deploy:
    needs: prepare
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify the live inline comparison and Mathlib foundations
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          python3 - <<'PY'
          import json,os,time,urllib.request
          sha=os.environ['SOURCE_SHA'];base=os.environ['PAGE_URL'].rstrip('/')
          def get(path,text=False):
              with urllib.request.urlopen(base+path+'?source='+sha,timeout=25) as r:
                  return r.read().decode() if text else json.load(r)
          last=None
          for attempt in range(12):
              try:
                  m=get('/reading/manifest.json');maps=get('/reading/maps.json')
                  comp=get('/reading/map-comparison.json');extra=get('/reading/mathlib-expansion.json')
                  assert m['sourceCommit']==maps['sourceCommit']==comp['sourceCommit']==extra['sourceCommit']==sha
                  assert m['preservedFirstTwo'] and m['compilerAuditPresent']
                  assert all(maps['checks'].values()) and all(extra['checks'].values())
                  assert maps['bundles']['thm:c3-primitive']['title']=='Cosine primitive'
                  assert 'thm:c3-mathlib-ftc' in maps['bundles']
                  html=get('/proof-map.html',True)
                  assert 'reading/map-comparison.js' in html and 'reading/map-comparison.css' in html
                  assert 'mountProofMapComparison' in get('/reading/map-comparison.js',True)
                  svg=get('/reading/cosine-2.svg',True)
                  assert 'data-node="thm:c3-mathlib-ftc"' in svg and 'data-node="def:c3-mathlib-bochner"' in svg
                  rows=comp['cases']['identity']['routes']
                  assert [rows[r]['costs']['full']['declarations'] for r in comp['routeOrder']]==[5596,5674,42849]
                  assert [rows[r]['costs']['full']['codeLines'] for r in comp['routeOrder']]==[8955,9124,81510]
                  print('LIVE MAP:',base+'/proof-map.html?theorem=thm:c3-primitive')
                  print('Verified source:',sha)
                  print('Visible inline comparison: 5596/5674/42849 declarations; 8955/9124/81510 mapped LOC, with source coverage')
                  print('Expanded Mathlib branch: nonnegative Lebesgue integral, general Bochner integral, interval integral, FTC')
                  print('Original proof terms, algorithms, chosen schedules and measured proof roots unchanged')
                  break
              except Exception as e:
                  last=str(e);time.sleep(5)
          else:raise SystemExit('Live verification failed: '+str(last))
          PY

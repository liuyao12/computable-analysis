name: Publish verified proof blueprint

# Publish only the exact proof-checked and browser-tested static artifact.
# No theorem sources are merged and no Pages protection is changed.
on:
  push:
    branches: [main]
    paths: ['.github/workflows/publish_verified_blueprint.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
  pages: write
  id-token: write
concurrency:
  group: pages-verified-proof-publication
  cancel-in-progress: false
env:
  SOURCE_RUN: '35065688785'
  SOURCE_SHA: 'c5176e0dc1a43d928adf6132baa625700dcf3b4e'
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Verify source proofs and schedule-aware map tests
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json,os,time,urllib.request
          base='https://api.github.com/repos/'+os.environ['GITHUB_REPOSITORY']
          def get(path):
              req=urllib.request.Request(base+path,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'})
              with urllib.request.urlopen(req,timeout=30) as r:return json.load(r)
          rid=os.environ['SOURCE_RUN']
          for attempt in range(180):
              run=get('/actions/runs/'+rid)
              assert run['head_sha']==os.environ['SOURCE_SHA'] and run['name']=='Three-proof blueprint'
              if run['status']=='completed':break
              time.sleep(5)
          assert run['conclusion']=='success','Refusing to publish an incomplete or failed build'
          job=next(j for j in get('/actions/runs/'+rid+'/jobs')['jobs'] if j['name']=='verify')
          assert job['conclusion']=='success'
          steps={s['name']:s['conclusion'] for s in job['steps']}
          for name in ['Build native basepoint proofs and exponential companion',
                       'Build all three proofs in one environment',
                       'Check identical statement and independent proof routes',
                       'Render blueprint and test the three-route graph',
                       'Test Lean statement boxes and Mathlib Real shading',
                       'Audit the native computability boundary',
                       'Build and verify the mathematical reader',
                       'Verify the supplied-schedule lemmas and refined proof map',
                       'Verify the radical evaluator and product theorem']:
              assert steps[name]=='success',name
          print('Verified original proofs, supplied-schedule lemmas, precise new edges and browser tests')
          PY
      - uses: actions/download-artifact@v8
        with:
          name: github-pages
          run-id: ${{ env.SOURCE_RUN }}
          github-token: ${{ github.token }}
          path: downloaded
      - name: Inspect the checked map and preserved mathematical artefacts
        run: |
          python3 - <<'PY'
          import hashlib,json,os,pathlib,tarfile,xml.etree.ElementTree as ET
          from fractions import Fraction as Q
          with tarfile.open('downloaded/artifact.tar') as t:t.extractall('site',filter='data')
          root=pathlib.Path('site')
          def read(p):return json.loads((root/p).read_text())
          sha=os.environ['SOURCE_SHA']
          m=read('reading/manifest.json');maps=read('reading/maps.json');s=read('reading/schedule-proof-map.json')
          assert m['sourceCommit']==maps['sourceCommit']==s['sourceCommit']==m['proofSourceCommit']==sha
          assert m['preservedFirstTwo'] and m['compilerAuditPresent']
          assert m['chapters']==17 and m['theoremMaps']==13 and m['checkedPairedMaps']==1 and m['checkedSingleProofMaps']==1
          assert all(maps['checks'].values()) and all(s['checks'].values())
          assert s['noIntegrabilityPredicateIntroduced'] and s['oldProofTermsUnchanged']
          assert s['mathlibValidityIsSeparate'] and s['genericScheduledBoundsAreContextOnly']
          assert len(s['displayedConvergenceProofs'])==3
          target='thm:c3-primitive';valid='lem:c3-construction-valid'
          assert maps['bundles'][target]['title']=='Cosine primitive'
          assert 'three proofs' not in maps['bundles'][target]['mathHtml'].lower()
          assert maps['bundles']['def:c3-integrals']['title']=='Integral construction'
          assert maps['bundles']['def:c3-integral']['title']=='Chosen cosine construction'
          for view,path in maps['theorems'][target]['views'].items():
              svg=ET.parse(root/path)
              nodes=[e.get('data-node') for e in svg.iter() if e.get('data-node')]
              edges=[e.get('data-edge') for e in svg.iter() if e.get('data-edge')]
              assert nodes.count(target)==1 and nodes.count(valid)==1
              assert sum(e.get('data-edge-kind')=='statement' for e in svg.iter())==4
              if view=='2':
                  assert valid+'->'+target not in edges
                  assert 'lem:c3-endpoint-representation->'+target in edges
              elif view in ['0','1']:assert valid+'->'+target in edges
          assert hashlib.sha256((root/'proof-bench/data.json').read_bytes()).hexdigest()==s['proofMetricsFileSha256']
          assert 'id="the-chosen-schedule"' in (root/'cosine.html').read_text()
          audit=read('reading/dyadic-evaluation.json');numbers=read('reading/dyadic-numerics.json')
          assert all(audit['checks'].values()) and all('sorryAx' not in r['axioms'] for r in audit['audits'])
          assert maps['theorems']['thm:dyadic-product']['verifiedGraph']
          assert not maps['theorems']['thm:dyadic-product']['checkedComparison']
          for path,h in maps['dyadicEvaluation']['unchangedArtifacts'].items():
              assert hashlib.sha256((root/path).read_bytes()).hexdigest()==h
          assert not numbers['leanStageExecution']
          assert numbers['rows'][-1]['productDisplay']==['0.999904116','1.000095875']
          for row in numbers['rows']:
              lo,hi=map(Q,row['product']);assert lo<1<hi
          geo=maps['geometricPresentation']
          assert geo['piDefinition']=='4 A(1)' and geo['verticalSubdivisionProjected']
          for name in ['arctan','cosine','secants']:
              assert (root/'reading/animations'/f'{name}.gif').read_bytes()[:6] in [b'GIF89a',b'GIF87a']
          native=read('reading/native-computability.json')
          assert native['nativeNoncomputableClosureCheck'] and native['nativeMathlibFree'] and native['noSorryAx']
          assert all(p['identicalMathematicalText'] for p in read('reading/preservation.json')['rendered'].values())
          print('Validated chosen construction, separate convergence, actual proof uses, no integrability predicate, and preserved earlier work')
          PY
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
          retention-days: 7
  deploy:
    needs: prepare
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify the live schedule-aware cosine map
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          python3 - <<'PY'
          import json,os,time,urllib.request
          sha=os.environ['SOURCE_SHA'];base=os.environ['PAGE_URL'].rstrip('/')
          def get(path,text=False):
              with urllib.request.urlopen(base+path+'?source='+sha,timeout=25) as r:
                  return r.read().decode() if text else json.load(r)
          last=None
          for attempt in range(12):
              try:
                  m=get('/reading/manifest.json');maps=get('/reading/maps.json');s=get('/reading/schedule-proof-map.json')
                  assert m['sourceCommit']==maps['sourceCommit']==s['sourceCommit']==sha
                  assert m['preservedFirstTwo'] and m['compilerAuditPresent']
                  assert all(maps['checks'].values()) and all(s['checks'].values())
                  assert s['noIntegrabilityPredicateIntroduced'] and s['mathlibValidityIsSeparate']
                  assert maps['bundles']['thm:c3-primitive']['title']=='Cosine primitive'
                  assert 'lem:c3-construction-valid' in maps['bundles']
                  assert 'id="the-chosen-schedule"' in get('/cosine.html',True)
                  svg=get('/reading/cosine-2.svg',True)
                  assert 'data-node="lem:c3-construction-valid"' in svg
                  assert 'data-edge="lem:c3-construction-valid-&gt;thm:c3-primitive"' not in svg
                  print('LIVE MAP:',base+'/proof-map.html?theorem=thm:c3-primitive')
                  print('Verified source:',sha)
                  print('Chosen schedule, its convergence certificates, and conditional schedule independence; no integrability predicate')
                  print('Conclusion title: Cosine primitive. Existing proof terms, algorithms and measured proof roots unchanged.')
                  break
              except Exception as e:
                  last=str(e);time.sleep(5)
          else:raise SystemExit('Live verification failed: '+str(last))
          PY

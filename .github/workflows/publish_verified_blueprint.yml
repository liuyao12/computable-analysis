name: Publish verified proof blueprint

# Documentation-only publication. The source run materializes readable files
# before rebuilding every proof. Verify both trigger and actual source SHAs.
# No theorem branch is merged and Pages protections are unchanged.
on:
  push:
    branches: [main]
    paths: ['.github/workflows/publish_verified_blueprint.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
  pages: write
  id-token: write
concurrency:
  group: pages-verified-proof-publication
  cancel-in-progress: false
env:
  SOURCE_RUN: '35121587005'
  SOURCE_SHA: 'f630241adeae35fc06a5fd4921a4df6396e291d0'
  TRIGGER_SHA: '6b0d89386074fd99ec422555169a539e8787ae80'
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - name: Require the full proof and reader verification to succeed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json,os,time,urllib.request
          base='https://api.github.com/repos/'+os.environ['GITHUB_REPOSITORY']
          def get(path):
              req=urllib.request.Request(base+path,headers={
                  'Authorization':'Bearer '+os.environ['GH_TOKEN'],
                  'Accept':'application/vnd.github+json'})
              with urllib.request.urlopen(req,timeout=30) as r:return json.load(r)
          rid=os.environ['SOURCE_RUN']
          for attempt in range(240):
              run=get('/actions/runs/'+rid)
              assert run['head_sha']==os.environ['TRIGGER_SHA']
              assert run['name']=='Integral portfolio verification'
              if run['status']=='completed':break
              time.sleep(15)
          assert run['conclusion']=='success','Refusing to publish failed or incomplete verification'
          job=next(j for j in get('/actions/runs/'+rid+'/jobs')['jobs'] if j['name']=='verify')
          assert job['conclusion']=='success'
          steps={s['name']:s['conclusion'] for s in job['steps']}
          for step in ['Materialize and commit the exact reviewed source patch',
                       'Verify all proofs, exact comparisons, mathematical maps and browser regressions',
                       'Retain the exact source and verified publication manifest']:
              assert steps[step]=='success',step
          print('Source verification passed:',rid,'; actual source SHA will also be checked in the artifact')
          PY
      - uses: actions/download-artifact@v8
        with:
          name: github-pages
          run-id: ${{ env.SOURCE_RUN }}
          github-token: ${{ github.token }}
          path: downloaded
      - name: Inspect the exact tested mathematics and comparisons
        run: |
          python3 - <<'PY'
          import hashlib,json,os,pathlib,tarfile,xml.etree.ElementTree as ET
          with tarfile.open('downloaded/artifact.tar') as archive:
              archive.extractall('site',filter='data')
          root=pathlib.Path('site')
          read=lambda path:json.loads((root/path).read_text())
          sha=os.environ['SOURCE_SHA']
          provenance=read('reading/portfolio-publication.json')
          assert provenance['sourceCommit']==sha
          assert provenance['triggerCommit']==os.environ['TRIGGER_SHA']
          assert str(provenance['sourceRun'])==os.environ['SOURCE_RUN']
          assert provenance['allVerificationStepsPassed']
          manifest=read('reading/manifest.json');maps=read('reading/maps.json')
          audit=read('reading/integral-portfolio-audit.json')
          comparison=read('reading/integral-portfolio-comparison.json')
          cartwright=read('reading/cartwright-audit.json')
          assert manifest['sourceCommit']==maps['sourceCommit']==audit['sourceCommit']==comparison['sourceCommit']==sha
          assert manifest['proofSourceCommit']==sha
          assert manifest['preservedFirstTwo'] and manifest['compilerAuditPresent']
          assert manifest['cartwrightComplete'] and manifest['integralPortfolio']
          assert manifest['chapters']==17 and manifest['checkedPairedMaps']==7
          assert manifest['checkedSingleProofMaps']==1 and manifest['partlyFormalizedPlans']==0
          assert all(audit['checks'].values()) and all(cartwright['checks'].values())
          assert audit['families']==2 and len(audit['closedProofs'])==16
          assert len(comparison['cases'])==8 and comparison['routeOrder']==['ftc','mathlib']
          assert all('sorryAx' not in row['axioms'] for row in audit['closedProofs'])
          keys=['thm:wallis-integrals','thm:wallis-product','thm:beta-integral','thm:beta-normalization']
          for key in keys:
              entry=maps['theorems'][key]
              assert entry['checkedComparison'] and entry['verifiedGraph'] and entry['sink']==key
              assert set(entry['views'])=={'all','1','2'}
              assert entry['comparison']['url']=='reading/integral-portfolio-comparison.json'
              for route,path in entry['views'].items():
                  svg=ET.parse(root/path)
                  nodes=[e.get('data-node') for e in svg.iter() if e.get('data-node')]
                  assert nodes.count(key)==1,(key,route)
                  if key.startswith('thm:beta'):
                      assert not any('trig' in n or 'exp' in n for n in nodes),nodes
          for path,expected in audit['unchangedArtifacts'].items():
              assert hashlib.sha256((root/path).read_bytes()).hexdigest()==expected,path
          for c in comparison['cases'].values():
              assert set(c['routes'])=={'ftc','mathlib'}
              for r in c['routes'].values():
                  for cost in r['costs'].values():
                      assert sum(o['declarations'] for o in cost['origins'].values())==cost['declarations']
                      assert cost['mappedDeclarations']+cost['unmappedDeclarations']==cost['declarations']
                      assert sum(o['codeLines'] for o in cost['origins'].values())==cost['codeLines']
          chapter=(root/'integral-families.html').read_text()
          for key in keys:assert 'data-proof-map="'+key+'"' in chapter
          assert (root/'cartwright.html').is_file()
          assert 'reading/map-comparison.js' in (root/'proof-map.html').read_text()
          native=read('reading/native-computability.json')
          assert native['nativeNoncomputableClosureCheck'] and native['nativeMathlibFree'] and native['noSorryAx']
          assert all(r['identicalMathematicalText'] for r in read('reading/preservation.json')['rendered'].values())
          examples=read('reading/integral-native-examples.json')
          assert examples['execution']=='Compiled Lean definitions; exact rational outputs, no Mathlib or Python evaluator.'
          print('Verified two new families, sixteen proof terms, four paired application maps, complete Cartwright, unchanged earlier artifacts')
          for case in ['wallis-factorials','wallis-product','beta-factorials','beta-normalization']:
              print(case,[(r,comparison['cases'][case]['routes'][r]['costs']['full']['declarations'],
                  comparison['cases'][case]['routes'][r]['costs']['full']['codeLines']) for r in comparison['routeOrder']])
          PY
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
          retention-days: 7
  deploy:
    needs: prepare
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify the live theorem portfolio and proof comparisons
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          python3 - <<'PY'
          import json,os,time,urllib.request
          sha=os.environ['SOURCE_SHA'];base=os.environ['PAGE_URL'].rstrip('/')
          def get(path,text=False):
              with urllib.request.urlopen(base+path+'?source='+sha,timeout=25) as r:
                  return r.read().decode() if text else json.load(r)
          last=None
          for attempt in range(18):
              try:
                  p=get('/reading/portfolio-publication.json')
                  m=get('/reading/manifest.json');maps=get('/reading/maps.json')
                  audit=get('/reading/integral-portfolio-audit.json')
                  comparison=get('/reading/integral-portfolio-comparison.json')
                  assert p['sourceCommit']==m['sourceCommit']==maps['sourceCommit']==comparison['sourceCommit']==sha
                  assert p['allVerificationStepsPassed'] and str(p['sourceRun'])==os.environ['SOURCE_RUN']
                  assert m['preservedFirstTwo'] and m['cartwrightComplete'] and m['integralPortfolio']
                  assert all(audit['checks'].values()) and len(audit['closedProofs'])==16
                  chapter=get('/integral-families.html',True)
                  for key in ['thm:wallis-integrals','thm:wallis-product','thm:beta-integral','thm:beta-normalization']:
                      assert 'data-proof-map="'+key+'"' in chapter
                      assert maps['theorems'][key]['checkedComparison']
                      svg=get('/'+maps['theorems'][key]['views']['2'],True)
                      assert 'data-node="'+key+'"' in svg
                  assert 'integral-portfolio-comparison.json' in json.dumps(maps)
                  print('LIVE CHAPTER:',base+'/integral-families.html')
                  print('CARTWRIGHT:',base+'/cartwright.html')
                  print('Verified readable source:',sha)
                  for case in ['wallis-factorials','wallis-product','beta-factorials','beta-normalization']:
                      print(case,[(r,comparison['cases'][case]['routes'][r]['costs']['full']['declarations'],
                          comparison['cases'][case]['routes'][r]['costs']['full']['codeLines']) for r in comparison['routeOrder']])
                  print('Both new families have matched native/Mathlib proofs; all four application maps and inline comparisons are live')
                  break
              except Exception as e:
                  last=str(e);time.sleep(5)
          else:raise SystemExit('Live verification failed: '+str(last))
          PY

name: Publish verified proof blueprint

# Publish only the exact checked artifact. Planned mathematical steps remain
# explicitly unproved; this workflow does not merge theorem source branches.
on:
  push:
    branches: [main]
    paths: ['.github/workflows/publish_verified_blueprint.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
  pages: write
  id-token: write
concurrency:
  group: pages-verified-proof-publication
  cancel-in-progress: false
env:
  SOURCE_RUN: '35078085642'
  SOURCE_SHA: 'f7f132a3e6637d778db537e1503f5106bdcc1a31'
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Verify the source proof and reader tests
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json,os,time,urllib.request
          base='https://api.github.com/repos/'+os.environ['GITHUB_REPOSITORY']
          def get(path):
              req=urllib.request.Request(base+path,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'})
              with urllib.request.urlopen(req,timeout=30) as r:return json.load(r)
          rid=os.environ['SOURCE_RUN']
          for attempt in range(180):
              run=get('/actions/runs/'+rid)
              assert run['head_sha']==os.environ['SOURCE_SHA'] and run['name']=='Three-proof blueprint'
              if run['status']=='completed':break
              time.sleep(5)
          assert run['conclusion']=='success','Refusing to publish failed or incomplete verification'
          job=next(j for j in get('/actions/runs/'+rid+'/jobs')['jobs'] if j['name']=='verify')
          assert job['conclusion']=='success'
          steps={s['name']:s['conclusion'] for s in job['steps']}
          for name in ['Build native basepoint proofs and exponential companion',
                       'Build all three proofs in one environment',
                       'Check identical statement and independent proof routes',
                       'Render blueprint and test the three-route graph',
                       'Test Lean statement boxes and Mathlib Real shading',
                       'Audit the native computability boundary',
                       'Build and verify the mathematical reader',
                       'Verify the supplied-schedule lemmas and refined proof map',
                       'Verify the inline comparison and Mathlib foundations',
                       'Verify the radical evaluator and product theorem',
                       'Check the arithmetic boundary and publish the planned application']:
              assert steps[name]=='success',name
          print('Verified existing proofs plus arithmetic boundary, partial-proof status and reader tests')
          PY
      - uses: actions/download-artifact@v8
        with:
          name: github-pages
          run-id: ${{ env.SOURCE_RUN }}
          github-token: ${{ github.token }}
          path: downloaded
      - name: Inspect completed arithmetic and unproved analytic frontier
        run: |
          python3 - <<'PY'
          import hashlib,json,os,pathlib,tarfile,xml.etree.ElementTree as ET
          with tarfile.open('downloaded/artifact.tar') as t:t.extractall('site',filter='data')
          root=pathlib.Path('site')
          def read(p):return json.loads((root/p).read_text())
          sha=os.environ['SOURCE_SHA'];m=read('reading/manifest.json');maps=read('reading/maps.json')
          plan=read('reading/cartwright-plan.json');raw=read('reading/cartwright-arithmetic.json')
          assert m['sourceCommit']==maps['sourceCommit']==plan['sourceCommit']==sha
          assert m['preservedFirstTwo'] and m['compilerAuditPresent'] and m['theoremMaps']==14
          assert m['checkedPairedMaps']==1 and m['checkedSingleProofMaps']==1 and m['partlyFormalizedPlans']==1
          assert all(raw['checks'].values()) and all(maps['checks'].values())
          assert len(raw['declarations'])==11 and len(raw['audits'])==2
          assert all('sorryAx' not in a['axioms'] for a in raw['audits'])
          assert not plan['finalIrrationalityProved'] and not plan['momentIdentityProved']
          assert all(v is None for v in plan['plannedMiddleCosts'].values())
          target='thm:cartwright-plan';entry=maps['theorems'][target]
          assert entry['outlineGraph'] and not entry['checkedComparison'] and not entry.get('verifiedGraph',False)
          for view,path in entry['views'].items():
              svg=ET.parse(root/path);nodes=[e.get('data-node') for e in svg.iter() if e.get('data-node')]
              assert len(nodes)==(11 if view=='all' else 9) and nodes.count(target)==1
              assert sum(e.get('data-planned')=='false' for e in svg.iter())==2
          for path,h in plan['unchangedArtifacts'].items():
              assert hashlib.sha256((root/path).read_bytes()).hexdigest()==h
          for key,s in plan['metrics'].items():
              assert s['mappedDeclarations']+s['unmappedDeclarations']==s['declarations']
          assert plan['metrics']['sharedUnion']['declarations']<sum(plan['metrics'][k]['declarations'] for k in ['preparation','conclusion'])
          assert 'not a completed formal proof' in (root/'cartwright.html').read_text()
          assert 'data-proof-map="thm:cartwright-plan"' in (root/'cartwright.html').read_text()
          assert 'cartwright.html' in (root/'cosine.html').read_text()
          assert 'cartwright-costs' in (root/'reading/graph.js').read_text()
          assert maps['bundles']['thm:c3-primitive']['title']=='Cosine primitive'
          comparison=read('reading/map-comparison.json')
          assert comparison['sourceCommit']==sha
          assert 'thm:c3-mathlib-ftc' in maps['bundles']
          assert all(a['identicalMathematicalText'] for a in read('reading/preservation.json')['rendered'].values())
          print('Validated checked arithmetic, unmeasured planned middles, source coverage, preserved existing comparisons and chapters')
          PY
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
          retention-days: 7
  deploy:
    needs: prepare
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify live arithmetic plan and truthful proof status
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          python3 - <<'PY'
          import json,os,time,urllib.request
          sha=os.environ['SOURCE_SHA'];base=os.environ['PAGE_URL'].rstrip('/')
          def get(path,text=False):
              with urllib.request.urlopen(base+path+'?source='+sha,timeout=25) as r:
                  return r.read().decode() if text else json.load(r)
          last=None
          for attempt in range(12):
              try:
                  m=get('/reading/manifest.json');maps=get('/reading/maps.json');plan=get('/reading/cartwright-plan.json')
                  raw=get('/reading/cartwright-arithmetic.json')
                  assert m['sourceCommit']==maps['sourceCommit']==plan['sourceCommit']==sha
                  assert m['preservedFirstTwo'] and m['compilerAuditPresent']
                  assert all(raw['checks'].values()) and len(raw['declarations'])==11
                  assert not plan['finalIrrationalityProved'] and not plan['momentIdentityProved']
                  assert all(v is None for v in plan['plannedMiddleCosts'].values())
                  assert maps['theorems']['thm:cartwright-plan']['outlineGraph']
                  html=get('/cartwright.html',True)
                  assert 'not a completed formal proof' in html and 'data-proof-map="thm:cartwright-plan"' in html
                  assert 'cartwright-costs' in get('/reading/graph.js',True)
                  assert 'cartwright.html' in get('/cosine.html',True)
                  print('LIVE CHAPTER:',base+'/cartwright.html')
                  print('LIVE PLAN:',base+'/proof-map.html?theorem=thm:cartwright-plan')
                  print('Verified source:',sha)
                  print('Checked shared arithmetic:',plan['metrics'])
                  print('Middle routes and pi-squared irrationality assembly are explicitly not yet proved or measured.')
                  break
              except Exception as e:
                  last=str(e);time.sleep(5)
          else:raise SystemExit('Live verification failed: '+str(last))
          PY

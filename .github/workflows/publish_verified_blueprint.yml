name: Publish verified proof blueprint

# Publish only the pinned, proof-checked and browser-tested static artifact.
# The theorem branch is not merged; Pages permissions and protection stay unchanged.
on:
  push:
    branches: [main]
    paths: ['.github/workflows/publish_verified_blueprint.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
  pages: write
  id-token: write
concurrency:
  group: pages-verified-proof-publication
  cancel-in-progress: false
env:
  SOURCE_RUN: '34925739800'
  SOURCE_SHA: 'b2cf9d0736f3c391157e9062ebc84ef643264e68'

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Verify source proofs, exported statements, and browser regressions
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.request
          base = 'https://api.github.com/repos/' + os.environ['GITHUB_REPOSITORY']
          def get(path):
              req = urllib.request.Request(base + path, headers={
                  'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
                  'Accept': 'application/vnd.github+json'})
              with urllib.request.urlopen(req, timeout=30) as response:
                  return json.load(response)
          run_id = os.environ['SOURCE_RUN']
          run = get('/actions/runs/' + run_id)
          assert run['head_sha'] == os.environ['SOURCE_SHA']
          assert run['name'] == 'Three-proof blueprint'
          assert run['conclusion'] == 'success'
          job = next(j for j in get('/actions/runs/' + run_id + '/jobs')['jobs'] if j['name'] == 'verify')
          assert job['conclusion'] == 'success'
          steps = {s['name']: s['conclusion'] for s in job['steps']}
          for step in ['Build native basepoint proofs and exponential companion',
                       'Build all three proofs in one environment',
                       'Check identical statement and independent proof routes',
                       'Render blueprint and test the three-route graph',
                       'Test Lean statement boxes and Mathlib Real shading']:
              assert steps[step] == 'success', step
          print('Verified checked statements, proof independence, and desktop/mobile browser tests')
          PY
      - uses: actions/download-artifact@v8
        with:
          name: github-pages
          run-id: ${{ env.SOURCE_RUN }}
          github-token: ${{ github.token }}
          path: downloaded
      - name: Inspect the graph snapshot and preserve old bookmarks
        run: |
          python3 - <<'PY'
          import json, os, pathlib, tarfile
          with tarfile.open('downloaded/artifact.tar') as archive:
              archive.extractall('site', filter='data')
          root = pathlib.Path('site')
          summary = json.loads((root/'three-proofs/summary.json').read_text())
          details = json.loads((root/'three-proofs/node-details.json').read_text())
          assert summary['sourceCommit'] == os.environ['SOURCE_SHA']
          assert all(summary['checks'].values()) and len(summary['metrics']) == 3
          assert summary['nodeDisplay']['version'] == 2
          target = details['thm:c3-primitive']
          assert target['classification'] == 'mixed'
          assert [bool(target['paths'][a]) for a in target['anchors']] == [False, False, True]
          assert any(d['name'] == 'ComputableAnalysis.CosinePrimitive.Statement' for d in target['declarations'])
          assert all(d['declarations'] for d in details.values())
          graph = (root/'cosine-primitive-graph.html').read_text()
          assert graph.count('id="thm:c3-primitive_modal"') == 1
          assert 'foundation-legend' in graph and 'bp-lean-code' in graph
          assert (root/'dep_graph_document.html').is_file()
          assert 'cosine-primitive-graph.html' in (root/'index.html').read_text()
          def redirect(path, target):
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_text('<!doctype html><html><head><meta charset="utf-8">'
                  '<meta http-equiv="refresh" content="0;url=' + target + '">'
                  '<title>Three proofs of one cosine primitive</title></head><body>'
                  '<p>Open <a href="' + target + '">the updated dependency graph</a>.</p></body></html>')
          redirect(root/'proof-comparison/index.html', '../cosine-primitive-graph.html')
          redirect(root/'ch-two-cosine-proofs.html', 'ch-three-cosine-proofs.html')
          print('Static snapshot validated:', summary['sourceCommit'])
          PY
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
          retention-days: 7

  deploy:
    needs: prepare
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify live statement boxes and dependency metadata
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          python3 - <<'PY'
          import json, os, time, urllib.request
          sha = os.environ['SOURCE_SHA']
          base = os.environ['PAGE_URL'].rstrip('/')
          last = None
          for attempt in range(12):
              try:
                  with urllib.request.urlopen(base+'/three-proofs/summary.json?source='+sha,timeout=20) as response:
                      summary = json.load(response)
                  assert summary['sourceCommit'] == sha
                  assert all(summary['checks'].values()) and summary['nodeDisplay']['version'] == 2
                  with urllib.request.urlopen(base+'/three-proofs/node-details.json?source='+sha,timeout=20) as response:
                      details = json.load(response)
                  assert details['thm:c3-primitive']['classification'] == 'mixed'
                  with urllib.request.urlopen(base+'/cosine-primitive-graph.html?source='+sha,timeout=20) as response:
                      graph = response.read().decode()
                  assert 'bp-lean-code' in graph and 'foundation-legend' in graph
                  assert graph.count('id="thm:c3-primitive_modal"') == 1
                  print('LIVE:', base+'/cosine-primitive-graph.html')
                  print('Verified source:', sha)
                  print('Lean statement boxes and route-sensitive Mathlib Real backgrounds are live')
                  break
              except Exception as exc:
                  last = str(exc)
                  time.sleep(5)
          else:
              raise SystemExit('Live verification failed: '+str(last))
          PY

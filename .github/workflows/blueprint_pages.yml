name: Build blueprint pages

on:
  push:
    paths:
      - "blueprint/**"
      - ".github/workflows/blueprint_pages.yml"
  pull_request:
    paths:
      - "blueprint/**"
      - ".github/workflows/blueprint_pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y graphviz libgraphviz-dev pkg-config poppler-utils

      - name: Install blueprint dependencies
        run: python -m pip install -r blueprint/requirements.txt

      - name: Build blueprint web output
        run: leanblueprint web

      - name: Configure Pages
        if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref_name == github.event.repository.default_branch)
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref_name == github.event.repository.default_branch)
        uses: actions/upload-pages-artifact@v5
        with:
          path: blueprint/web

  deploy:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref_name == github.event.repository.default_branch)
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build

    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

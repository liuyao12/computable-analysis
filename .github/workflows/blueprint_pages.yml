name: Build blueprint pages

# Validate the source manuscript independently. The checked reader is published
# only by publish_verified_blueprint.yml, preventing a second workflow from
# replacing the reader, proof maps and flashcards with a bare legacy render.
on:
  push:
    branches: [main]
    paths:
      - "blueprint/**"
      - ".github/workflows/blueprint_pages.yml"
  pull_request:
    paths:
      - "blueprint/**"
      - ".github/workflows/blueprint_pages.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.x"
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y graphviz libgraphviz-dev pkg-config poppler-utils ghostscript dvisvgm texlive-latex-base texlive-latex-extra texlive-pictures
      - name: Install blueprint dependencies
        run: python -m pip install -r blueprint/requirements.txt
      - name: Build blueprint web output
        run: leanblueprint web
      - name: Retain the manuscript rendering for inspection
        uses: actions/upload-artifact@v4
        with:
          name: manuscript-rendering
          path: blueprint/web
          retention-days: 7

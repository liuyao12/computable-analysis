function moduleGraph(roots){expandedRoots=roots;const deps=[...new Set(roots.flatMap(r=>M.imports[r]||[]))].filter(d=>!roots.includes(d));const names=[...deps,...roots],pos=new Map();deps.forEach((d,i)=>pos.set(d,{x:20+(i%3)*325,y:40+Math.floor(i/3)*112}));roots.forEach((r,i)=>pos.set(r,{x:20+(i%3)*325,y:80+Math.ceil(deps.length/3)*112+Math.floor(i/3)*112}));let height=230+Math.ceil(deps.length/3)*112+Math.ceil(roots.length/3)*112;let svg=se('svg',{viewBox:`0 0 1000 ${height}`,role:'group','aria-label':'Expanded bundle: exact direct source imports',preserveAspectRatio:'xMidYMin meet'});svg.style.width=(100*scale)+'%';svg.style.height=Math.max(700,height)*scale+'px';let title=se('text',{x:20,y:22,fill:'#345846','font-size':16},'Exact source imports · dependency arrows point toward the importing module');svg.append(title);let defs=se('defs',{}),mark=se('marker',{id:'module-arrow',viewBox:'0 0 10 10',refX:9,refY:5,markerWidth:6,markerHeight:6,orient:'auto'});mark.append(se('path',{d:'M0 0L10 5L0 10z',fill:'#809b89'}));defs.append(mark);svg.append(defs);for(let r of roots){let b=pos.get(r);for(let d of M.imports[r]||[]){let a=pos.get(d);if(!a)continue;svg.append(se('path',{d:`M${a.x+145} ${a.y+82}L${b.x+145} ${b.y}`,class:'edge','marker-end':'url(#module-arrow)'}))}}for(let name of names){let p=pos.get(name),g=se('g',{transform:`translate(${p.x},${p.y})`,class:'node module-node',tabindex:0,role:'button','aria-label':'Open source module '+name});g.append(se('rect',{width:290,height:82,rx:8,fill:roots.includes(name)?'#d8e7dc':'#f0f5ef',stroke:'#9bb19f'}));let label=name.replace('ComputableAnalysis.',''),lines=[];while(label.length){lines.push(label.slice(0,34));label=label.slice(34)}lines.slice(0,4).forEach((text,i)=>g.append(se('text',{x:10,y:20+i*16,'font-size':11,'font-family':'monospace',fill:'#243c34'},text)));g.onclick=()=>moduleView(name);g.onkeydown=e=>{if(['Enter',' '].includes(e.key)){e.preventDefault();moduleView(name)}};svg.append(g)}$('canvas').replaceChildre function select(id){selected=id;expandedRoots=null;draw();let n=M.nodes.find(n=>n.id===id),d=$('detail');d.replaceChildren(el('h2',n.title),el('div',n.formula.replace(/\\n/g,'\n')),prose(n.body));let dt=el('details'),sm=el('summary','Expand source bundle ('+n.roots.length+' modules)');dt.append(sm);for(let r of n.roots){let b=el('button',r);b.className='module';b.onclick=()=>moduleView(r);dt.append(b)}d.append(dt);if(['exp','error'].includes(id)){let chapter=el('a','Read the exponential and logarithm foundation');chapter.href='ch-exponential-logarithm.html#section-8';d.append(chapter)}if(['elliptic','square','cm43'].includes(id)){let audit=el('p'),link=el('a','Read the checked CM fixed-point and orbit audit');link.href='modular-cm-values-audit.txt';audit.append(link);d.append(audit)}if(['elliptic','square','cm43'].includes(id)){let pack=el('p'),link=el('a','Download the complete checked CM proof sources');link.href='modular-cm-values-proof.tar.gz';pack.append(link);d.append(pack)}if(id==='error'){let audit=el('p'),link=el('a','Read the checked CM exponential bridge and axiom audit');link.href='modular-exponential-foundation-audit.txt';audit.append(link);d.append(audit)}let expand=el('button','Expand this bundle in graph');expand.onclick=()=>moduleGraph(n.roots);d.append(expand);if(['pi','exp'].includes(id)){let a=el('details');a.append(el('summary','Expand the fresh executable real-name audit'),el('pre',M.constantsAudit));let link=el('a','Read the checked execution and axiom output');link.href='modular-constants-audit.txt';a.append(link);d.append(a)}let more=el('details'),ms=el('summary','Expand transitive import closure');more.append(ms);let seen=new Set(),todo=[...n.roots];while(todo.length){let x=todo.pop();if(seen.has(x))continue;seen.add(x);todo.push(...(M.imports[x]||[]).filter(y=>M.imports[y]))}more.append(el('p',seen.size+' project modules. Filter or open a module to inspect its imports.'));let search=el('input');search.placeholder='Filter module names';sear function learn(index=0){route=['square','cm43'].includes(M.lessons[index].node)?M.lessons[index].node:'integer';selected=M.lessons[index].node;expandedRoots=null;draw();let l=M.lessons[index],d=$('detail');d.replaceChildren(el('small','Guided proof · step '+(index+1)+' of '+M.lessons.length),el('h2',l.question),el('div',l.formula),el('p',l.answer));let controls=el('nav');for(let i=0;i<M.lessons.length;i++){let b=el('button',String(i+1));b.setAttribute('aria-label','Proof step '+(i+1));if(i===index)b.className='active';b.onclick=()=>learn(i);controls.append(b)}d.append(controls);if(index<M.lessons.length-1){let next=el('button','Next question');next.onclick=()=>learn(index+1);d.append(next)}let explain=el('button','Explore this mathematical bundle');explain.onclick=()=>select(l.node);d.append(explain);let sources=el('details');sources.append(el('summary','Inspect the Lean evidence for this step'));for(let r of l.roots){let b=el('button',r);b.className='module';b.onclick=()=>moduleView(r);sources.append(b)}d.append(sources);d.append(el('p','The guided steps explain this particular index-41 proof. They are a mathematical reading order; use source expansion to inspect literal import dependencies.'));typeset()}
